<title>Exploratory Causal Inference x Mice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+Condensed:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Single light theme by choice: every colour is set here, no dark variant. */
:root{
  color-scheme:light;
  --bg:#ffffff; --ink:#17211e; --muted:#6a7571; --faint:#9aa4a0; --line:#e5e9e7; --soft:#f5f7f6;
  --accent:#0f6b62; --accent-ink:#ffffff; --accent-soft:#e6f2ef;
  --wt:#2a78b5; --het:#d9661f; --pass:#1f7a45; --pass-bg:#e5f3ea;
  --warn:#9a4a00; --warn-bg:#fdf1e3; --shade:rgba(15,107,98,.08);
  --mono:"IBM Plex Mono",ui-monospace,SFMono-Regular,Menlo,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --cond:"IBM Plex Sans Condensed","IBM Plex Sans",system-ui,sans-serif;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font:14.5px/1.45 var(--sans);margin:0}
.wrap{max-width:1240px;margin:0 auto;padding-inline:16px;padding-block:24px 48px;display:grid;gap:18px}
h1,h2,h3{font-family:var(--cond);font-weight:600;text-wrap:balance;margin:0}
h1{font-size:26px;line-height:1.1}
h2{font-size:22px;line-height:1.1}
h3{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
p{margin:0}
.sub{color:var(--muted);font-size:13.5px;margin-top:4px}
.num,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[title]{text-underline-offset:3px}
abbr[title],.tip{text-decoration:underline dotted var(--faint);cursor:help}

/* control bar */
.bar{display:flex;flex-wrap:wrap;gap:10px 20px;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);padding-bottom:12px}
.tabs{display:flex;gap:4px}
.tab{border:0;background:none;padding:6px 10px;border-radius:6px;cursor:pointer;font:500 14px var(--sans);color:var(--muted)}
.tab[aria-selected="true"]{background:var(--soft);color:var(--ink)}
.tab .n{font:500 12px var(--mono);color:var(--faint);margin-left:4px}
.opts{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center;font-size:12.5px;color:var(--muted)}
.opt{display:inline-flex;gap:6px;align-items:center}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--bg);padding:4px 10px;cursor:pointer;font:500 12px var(--sans);color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.sel{font:500 12px var(--mono);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:3px 6px;max-width:100%}
.clipbar{display:flex;flex-wrap:wrap;gap:8px 18px;align-items:center;font-size:12.5px;color:var(--muted)}
.cgrid{display:flex;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:thin;cursor:grab;user-select:none;padding-bottom:4px;--per:4}
.cgrid.drag{cursor:grabbing;scroll-snap-type:none}
.cgrid .clip{flex:0 0 calc((100% - (var(--per) - 1) * 8px) / var(--per));scroll-snap-align:start}
.clip{position:relative;min-width:0}
.clip.miss{aspect-ratio:1;border:1px dashed var(--line);border-radius:4px;display:grid;place-items:center;text-align:center;font-size:11.5px;color:var(--faint);padding:8px}
.hd .row{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.hd .row .meta{font-size:12px;color:var(--muted)}
.turbo{display:inline-block;width:90px;height:8px;border-radius:2px;vertical-align:middle;margin:0 4px;background:linear-gradient(90deg,#30123b,#4686fb,#1ae4b6,#a2fc3c,#fabb39,#e4460a,#7a0403)}
.swatch{display:inline-block;width:28px;height:5px;vertical-align:middle;margin:0 3px;border-radius:1px}
.clip canvas{width:100%;height:auto;aspect-ratio:1;display:block;background:#111;border-radius:4px}
.clip .rk{position:absolute;right:4px;bottom:12px;font:500 10.5px var(--mono);background:rgba(0,0,0,.6);color:#fff;padding:0 4px;border-radius:3px}
.srcv{position:absolute;width:2px;height:2px;opacity:0;pointer-events:none;left:0;top:0}
.chart{max-width:640px}
.pend{border:1px dashed var(--line);border-radius:6px;color:var(--faint);font-size:12px;display:grid;place-items:center;text-align:center;padding:16px;min-height:160px}
.arena{position:relative;max-width:420px}
.arena canvas{position:relative;width:100%;height:auto;display:block;border-radius:4px;image-rendering:pixelated}
.arena .bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;border-radius:4px;filter:grayscale(1)}
.scale{display:flex;align-items:center;gap:6px;font:11px var(--mono);color:var(--muted);margin-top:4px}
.scale i{display:inline-block;width:120px;height:8px;border-radius:2px;background:linear-gradient(90deg,#30123b,#4686fb,#1ae4b6,#a2fc3c,#fabb39,#e4460a,#7a0403)}

/* comparison picker */
.picker{display:flex;flex-wrap:wrap;gap:12px 32px;align-items:flex-start}
.fam{display:grid;gap:6px;min-width:0}
.fa{display:grid;grid-template-columns:auto repeat(4,minmax(58px,1fr));gap:4px;align-items:stretch}
.fa .rh{font:500 12px var(--mono);color:var(--muted);align-self:center;padding-right:4px}
.fa .ch{font-size:11.5px;color:var(--muted);text-align:center;line-height:1.2;align-self:end}
.fb{display:grid;grid-template-columns:repeat(6,minmax(48px,1fr));gap:4px}
.cb{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:5px 6px;cursor:pointer;display:grid;gap:0;text-align:center;min-width:0}
.cb .t{font:500 12px var(--sans)}
.cb .c{font:500 13px var(--mono)}
.cb.zero .c{color:var(--faint)}
.cb:hover{border-color:var(--accent)}
.cb[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.cb[aria-pressed="true"] .c{color:var(--accent-ink)}

/* main split */
.main{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:28px;align-items:start}
.main.wide{grid-template-columns:minmax(0,440px) minmax(0,1fr)}
.side{display:grid;gap:8px;min-width:0}
.side-head{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.side-head .meta{font-size:12px;color:var(--muted)}
.rows{display:grid;gap:2px}
.nr{border:0;border-radius:6px;background:none;padding:7px 8px;cursor:pointer;display:grid;grid-template-columns:52px 1fr;gap:2px 8px;text-align:left;width:100%}
.nr:hover{background:var(--soft)}
.nr[aria-pressed="true"]{background:var(--accent-soft)}
.nr .id{font:600 16px var(--cond);grid-row:span 2;align-self:center}
.nr .l1{display:flex;gap:10px;align-items:baseline;font:12.5px var(--mono);flex-wrap:wrap}
.nr .pv{color:var(--muted)}
.up{color:var(--pass)} .down{color:var(--het)}
.chips{display:flex;flex-wrap:wrap;gap:3px}
.chip{font:500 10px/1.5 var(--mono);padding:0 4px;border-radius:3px;white-space:nowrap;cursor:help}
.chip.Y{background:var(--pass-bg);color:var(--pass)}
.chip.N{background:var(--soft);color:var(--faint);text-decoration:line-through}
.chip.na{color:var(--faint);box-shadow:inset 0 0 0 1px var(--line)}
.chip.warn{background:var(--warn-bg);color:var(--warn)}
.empty{padding:12px;border:1px dashed var(--line);border-radius:6px;color:var(--muted);font-size:13px}

/* all-neurons table */
.tw{overflow-x:auto}
table.all{border-collapse:collapse;width:100%;font-size:12.5px}
table.all th{font:500 11.5px var(--sans);color:var(--muted);text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
table.all th button{border:0;background:none;padding:0;cursor:pointer;font:inherit;color:inherit}
table.all th button[aria-pressed="true"]{color:var(--accent)}
table.all td{padding:5px 6px;border-bottom:1px solid var(--line);vertical-align:top}
table.all tr{cursor:pointer}
table.all tbody tr:hover{background:var(--soft)}
table.all tr.on{background:var(--accent-soft)}
table.all .id{font:600 14px var(--cond)}
.tags{display:flex;flex-wrap:wrap;gap:3px}
.tag{font:500 10.5px/1.6 var(--mono);padding:0 5px;border-radius:3px;background:var(--soft);white-space:nowrap}
button.tag{border:0;cursor:pointer}
button.tag:hover{box-shadow:inset 0 0 0 1px var(--accent)}
.tag.cur{background:var(--accent);color:var(--accent-ink)}

/* detail */
.detail{display:grid;gap:18px;min-width:0}
.dh{display:grid;gap:6px}
.dh .l{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline}
.facts{font:13px var(--mono);color:var(--muted)}
.warnbox{background:var(--warn-bg);color:var(--warn);border-radius:6px;padding:7px 10px;font-size:13px}
.vid{display:grid;gap:6px;min-width:0}
.vid .cap{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;min-height:22px}
video{width:100%;max-width:100%;aspect-ratio:3/2;background:#111;border-radius:4px;display:block}
.switch{display:inline-flex;gap:6px;align-items:center;cursor:pointer;font-size:12.5px;color:var(--ink)}
.switch input{appearance:none;width:28px;height:16px;border-radius:8px;background:var(--line);position:relative;cursor:pointer;margin:0;transition:background .15s}
.switch input::after{content:"";position:absolute;top:2px;left:2px;width:12px;height:12px;border-radius:50%;background:#fff;transition:left .15s}
.switch input:checked{background:var(--accent)}
.switch input:checked::after{left:14px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
.chart svg{width:100%;height:auto;display:block}
.lg{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12px;color:var(--muted);align-items:center;margin:4px 0}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px}
.hd{display:grid;gap:6px}
.note{font-size:12px;color:var(--muted);max-width:62ch}
@media (max-width:900px){.main,.main.wide,.two{grid-template-columns:minmax(0,1fr)}}
@media (max-width:560px){
  .cgrid{--per:2}
  .fa{grid-template-columns:auto repeat(4,minmax(0,1fr))}
  .fb{grid-template-columns:repeat(3,minmax(0,1fr))}
  .bar{justify-content:flex-start}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>

<div class="wrap">
  <header>
    <h1>Exploratory Causal Inference x Mice</h1>
    <p class="sub" id="saeDesc"></p>
    <p class="sub">Visual concepts (<span class="tip" title="Units of a sparse autoencoder trained on DINOv2 patch features of the mice v1 videos. Each unit fires on a narrow visual pattern.">SAE neurons</span>) whose activation changes with odor stage or genotype</p>
  </header>

  <nav class="bar" aria-label="View and settings">
    <div class="tabs" role="tablist">
      <button type="button" class="tab" role="tab" id="tabCmp" data-view="cmp">By comparison</button>
      <button type="button" class="tab" role="tab" id="tabAll" data-view="all">All neurons<span class="n" id="allN"></span></button>
    </div>
    <div class="opts">
      <span class="opt" id="outcomeOpt" hidden><span class="tip" title="Per-video outcome the search tests">Outcome</span><span class="seg" id="outcomeSeg"></span></span>
      <span class="opt"><label class="tip" for="saeSel" title="Sparse autoencoder whose neurons are searched">SAE</label><select id="saeSel" class="sel"></select></span>
      <span class="opt"><span class="tip" title="Search only the first 128 neurons (the coarse Matryoshka prefix) or all 1024">Neurons</span><span class="seg" id="prefixSeg"><button type="button" data-p="128">128</button><button type="button" data-p="1024">1024</button></span></span>
    </div>
  </nav>

  <section class="picker" id="picker" aria-label="Choose a comparison">
    <div class="fam">
      <h3 class="tip" title="Paired change between two stages of the same pool, within one genotype (36 pools)">A · stage change</h3>
      <div class="fa" id="famA"></div>
    </div>
    <div class="fam">
      <h3 class="tip" title="het minus wt videos within one stage (36 vs 36)">B · het vs wt</h3>
      <div class="fb" id="famB"></div>
    </div>
  </section>

  <div class="main" id="main">
    <aside class="side" id="side" aria-label="Discovered neurons"></aside>
    <section class="detail" id="detail" aria-live="polite"></section>
  </div>
</div>

<script>
const ALL = /*__DATA__*/null;
const SAES = Object.fromEntries(ALL.saes.map(d => [d.sae, d]));
const DATA0 = SAES[ALL.default];
const M = ALL.montage;   // montage layout: K tiles per block, cols per row, blocks [top, top_heat, least, least_heat]
let DATA = DATA0;
const STAGE = {1:'H,S',2:'O,S',3:'P,S',4:'H,F',5:'O,F',6:'P,F'};
const STAGE_LONG = {1:'habituation, social odor',2:'social odor',3:'post, social odor',4:'habituation, fear odor',5:'fear odor',6:'post, fear odor'};
const TRANS = {'1to2':'Social H→O','2to3':'Social O→P','4to5':'Fear H→O','5to6':'Fear O→P'};
const TAU_TIP = 'tau: effect size in the outcome unit. A: mean paired change from the first to the second stage. B: het minus wt.';
const P_TIP = 'p: t-test p-value. Found = p below the Bonferroni threshold of that search round.';
const state = {sae:DATA0.sae, nclips:4, len:'1s', view:'cmp', outcome:DATA.outcomes[0].id, aid:'A_het_1to2', prefix:128, window:'full', neuron:null, heat:true, sort:'count'};
try{ Object.assign(state, JSON.parse(localStorage.getItem('nes-atlas')||'{}')); }catch(e){}
DATA = SAES[state.sae] || DATA0; state.sae = DATA.sae; state.window = 'full';
if(!(state.len in M.lengths)) state.len = '1s';
if(![4,8,16].includes(state.nclips)) state.nclips = 4;
if(!DATA.outcomes.some(o=>o.id===state.outcome)) state.outcome = DATA.outcomes[0].id;
if(!DATA.analyses.some(a=>a.id===state.aid)) state.aid = DATA.analyses[0].id;
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmtP = p => p<1e-3 ? p.toExponential(1).replace('e-','e−') : p.toFixed(4);
const fmtTau = t => (t>=0?'+':'−')+Math.abs(t).toPrecision(3);
const save = () => { try{ localStorage.setItem('nes-atlas', JSON.stringify(state)); }catch(e){} };
const res = (aid=state.aid) => DATA.results[`${state.outcome}|${aid}|${state.prefix}|${state.window}`] || {rows:[]};
const analysis = id => DATA.analyses.find(a => a.id===id);
const outcome = () => DATA.outcomes.find(o => o.id===state.outcome);
const NE = () => DATA.neurons[outcome().codes];
function label(a){
  if(a.family==='A') return `${a.genotype} · ${TRANS[a.id.split('_')[2]]}`;
  return `het vs wt · stage ${a.stage} (${STAGE[a.stage]})`;
}
function shortLabel(a){
  return a.family==='A' ? `${a.genotype} ${a.stages[0]}→${a.stages[1]}` : `B${a.stage}`;
}
function longLabel(a){
  if(a.family==='A') return `${a.genotype}, stage ${a.stages[0]} (${STAGE_LONG[a.stages[0]]}) → stage ${a.stages[1]} (${STAGE_LONG[a.stages[1]]})`;
  return `het vs wt in stage ${a.stage} (${STAGE_LONG[a.stage]})`;
}
const SS=$('#saeSel');
SS.innerHTML = ALL.saes.map(d=>`<option value="${esc(d.sae)}" title="${esc(d.desc)} (${esc(d.sae)})">${esc(d.label)}</option>`).join('');
SS.value = state.sae;
SS.onchange = () => {
  DATA = SAES[SS.value]; state.sae = SS.value; state.neuron = null;
  if(!DATA.outcomes.some(o=>o.id===state.outcome)) state.outcome = DATA.outcomes[0].id;
  if(!DATA.analyses.some(a=>a.id===state.aid)) state.aid = DATA.analyses[0].id;
  render();
};

/* every neuron found in any analysis under the current outcome / window / prefix */
function allFound(){
  const m = new Map();
  for(const a of DATA.analyses){
    for(const r of res(a.id).rows){
      if(!m.has(r.neuron)) m.set(r.neuron, {neuron:r.neuron, hits:[]});
      m.get(r.neuron).hits.push({a, r});
    }
  }
  return [...m.values()].map(x => Object.assign(x, {count:x.hits.length, best:Math.min(...x.hits.map(h=>h.r.p))}));
}

function buildControls(){
  const A=$('#famA'); A.innerHTML='<span></span>'+Object.values(TRANS).map(t=>`<span class="ch">${t.replace(' ','<br>')}</span>`).join('');
  for(const g of ['het','wt']){
    A.insertAdjacentHTML('beforeend', `<span class="rh">${g}</span>`);
    for(const t of Object.keys(TRANS)){
      const id=`A_${g}_${t}`, a=analysis(id); if(!a){ A.insertAdjacentHTML('beforeend','<span></span>'); continue; }
      const n=res(id).rows.length;
      A.insertAdjacentHTML('beforeend', `<button type="button" class="cb${n?'':' zero'}" data-aid="${id}" aria-pressed="${state.view==='cmp'&&state.aid===id}" title="${esc(longLabel(a))}: ${n} found"><span class="c">${n}</span></button>`);
    }
  }
  const B=$('#famB'); B.innerHTML='';
  for(let s=1;s<=6;s++){
    const id=`B_stage${s}`, a=analysis(id); if(!a) continue;
    const n=res(id).rows.length;
    B.insertAdjacentHTML('beforeend', `<button type="button" class="cb${n?'':' zero'}" data-aid="${id}" aria-pressed="${state.view==='cmp'&&state.aid===id}" title="${esc(longLabel(a))}: ${n} found"><span class="t">${s} · ${STAGE[s]}</span><span class="c">${n}</span></button>`);
  }
  for(const b of document.querySelectorAll('.cb')) b.onclick=()=>{ state.view='cmp'; state.aid=b.dataset.aid; state.neuron=null; render(); };
  const OS=$('#outcomeSeg');
  $('#outcomeOpt').hidden = DATA.outcomes.length<2;
  OS.innerHTML = DATA.outcomes.map(o=>`<button type="button" data-o="${o.id}" aria-pressed="${o.id===state.outcome}" title="${esc(o.setting)}">${esc(o.label)}</button>`).join('');
  for(const b of OS.querySelectorAll('button')) b.onclick=()=>{ state.outcome=b.dataset.o; render(); };
  SS.value = state.sae; SS.title = `${DATA.desc} (${DATA.sae})`;
  $('#saeDesc').textContent = `SAE: ${DATA.desc} (${DATA.sae}).`;
  for(const b of document.querySelectorAll('#prefixSeg button')) b.setAttribute('aria-pressed', String(+b.dataset.p===state.prefix));
  for(const t of document.querySelectorAll('.tab')) t.setAttribute('aria-selected', String(t.dataset.view===state.view));
  $('#allN').textContent = allFound().length;
  $('#picker').hidden = state.view!=='cmp';
  $('#main').classList.toggle('wide', state.view==='all');
}
for(const b of document.querySelectorAll('#prefixSeg button')) b.onclick=()=>{ state.prefix=+b.dataset.p; render(); };
for(const t of document.querySelectorAll('.tab')) t.onclick=()=>{ state.view=t.dataset.view; render(); };

function chipsHTML(r){
  let h = r.rob.map(([lab,tip,v]) => {
    const cls = v==='Y'?'Y':v==='N'?'N':'na';
    const what = v==='Y'?'still found':v==='N'?'not found':'not run';
    return `<span class="chip ${cls}" title="${esc(tip)}: ${what}">${esc(lab)}</span>`;
  }).join('');
  if(NE()[r.neuron] && NE()[r.neuron].artefact) h+=`<span class="chip warn" title="${esc(DATA.artefact_text[r.neuron]||'likely artefact')}">⚠</span>`;
  return h;
}

function renderCmpList(){
  const a=analysis(state.aid), R=res(), S=$('#side');
  const unit = a.family==='A' ? `${a.n_units} paired pools` : `${a.n_units} videos`;
  let h=`<div class="side-head"><h2 title="${esc(longLabel(a))}">${esc(label(a))}</h2><span class="meta">${unit} · ${R.n_tested_total||0} tested · <span class="tip" title="${TAU_TIP}">τ</span> in ${esc(outcome().unit)}</span></div>`;
  if(!R.rows.length){
    state.neuron=null; S.innerHTML = h+`<div class="empty">No neuron found with these settings.</div>`; return;
  }
  if(state.neuron===null || !R.rows.some(r=>r.neuron===state.neuron)) state.neuron=R.rows[0].neuron;
  h+='<div class="rows">';
  for(const r of R.rows){
    const up=r.tau>0;
    h+=`<button type="button" class="nr" data-n="${r.neuron}" aria-pressed="${r.neuron===state.neuron}" title="round ${r.round}: p ${fmtP(r.p)} < threshold ${fmtP(r.threshold)} (${r.n_tested} tested)">
      <span class="id">#${r.neuron}</span>
      <span class="l1"><span class="${up?'up':'down'}">${up?'▲':'▼'} ${fmtTau(r.tau)}</span><span class="pv">p ${fmtP(r.p)}</span></span>
      <span class="chips">${chipsHTML(r)}</span></button>`;
  }
  S.innerHTML = h+'</div>';
  for(const b of S.querySelectorAll('.nr')) b.onclick=()=>{ state.neuron=+b.dataset.n; render(); };
}

function renderAllList(){
  const S=$('#side'), L=allFound();
  L.sort(state.sort==='neuron' ? (x,y)=>x.neuron-y.neuron : state.sort==='p' ? (x,y)=>x.best-y.best : (x,y)=>y.count-x.count||x.best-y.best);
  let h=`<div class="side-head"><h2>All discovered neurons</h2><span class="meta">${L.length} neurons · ${DATA.analyses.length} analyses</span></div>`;
  if(!L.length){ S.innerHTML=h+`<div class="empty">No neuron found with these settings.</div>`; return; }
  if(state.neuron===null || !L.some(x=>x.neuron===state.neuron)) state.neuron=L[0].neuron;
  const sb=(k,t,tip)=>`<button type="button" data-s="${k}" aria-pressed="${state.sort===k}" title="${tip}">${t}${state.sort===k?' ↓':''}</button>`;
  h+=`<div class="tw"><table class="all"><thead><tr><th>${sb('neuron','Neuron','Sort by neuron id')}</th><th>${sb('count','#','Number of analyses where it is found; sort')}</th><th>Found in</th><th>${sb('p','Best p','Smallest p over those analyses; sort')}</th><th></th></tr></thead><tbody>`;
  for(const x of L){
    const tags = x.hits.map(({a,r})=>`<span class="tag ${r.tau>0?'up':'down'}" title="${esc(longLabel(a))}: tau ${fmtTau(r.tau)} ${esc(outcome().unit)}, p ${fmtP(r.p)}">${shortLabel(a)}${r.tau>0?'▲':'▼'}</span>`).join('');
    const art = NE()[x.neuron] && NE()[x.neuron].artefact;
    h+=`<tr data-n="${x.neuron}" class="${x.neuron===state.neuron?'on':''}" tabindex="0"><td class="id">#${x.neuron}</td><td class="num">${x.count}</td><td><span class="tags">${tags}</span></td><td class="num">${fmtP(x.best)}</td><td>${art?`<span class="chip warn" title="${esc(DATA.artefact_text[x.neuron]||'likely artefact')}">⚠</span>`:''}</td></tr>`;
  }
  S.innerHTML = h+'</tbody></table></div>';
  for(const b of S.querySelectorAll('th button')) b.onclick=()=>{ state.sort=b.dataset.s; render(); };
  for(const tr of S.querySelectorAll('tbody tr')){
    const go=()=>{ state.neuron=+tr.dataset.n; render(); };
    tr.onclick=go; tr.onkeydown=e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); go(); } };
  }
}

function niceStep(r){ const e=Math.pow(10,Math.floor(Math.log10(r||1e-3))), f=r/e; return (f<=1?1:f<=2?2:f<=5?5:10)*e; }
function chartTable(j, n){
  const ot = DATA.otables[state.outcome];
  return ot ? {T:ot[state.window][j], what:`${outcome().unit} per video (${state.window==='full'?'full videos':'first 30 s dropped'})`}
            : {T:n.table, what:`mean codes_${outcome().codes} per video`};
}
/* ---- activation histogram: n.hist = {edges:[B+1], counts:{all:[B], 'het|1':[B], ...}, thr} ---- */
function histSVG(n, a){
  const H = n.hist, E = H.edges, B = E.length - 1, W = 460, Ht = 200, m = {l:44, r:10, t:10, b:30};
  const norm = c => { const s = c.reduce((p,q)=>p+q, 0) || 1; return c.map(v => v / s); };
  const series = [{c:norm(H.counts.all), col:'var(--faint)', fill:true, name:'all frames'}];
  if(a){
    const keys = a.family==='A' ? [[`${a.genotype}|${a.stages[0]}`,'var(--wt)',`stage ${a.stages[0]}`],[`${a.genotype}|${a.stages[1]}`,'var(--het)',`stage ${a.stages[1]}`]]
                                : [[`wt|${a.stage}`,'var(--wt)','wt'],[`het|${a.stage}`,'var(--het)','het']];
    for(const [k,col,name] of keys) if(H.counts[k]) series.push({c:norm(H.counts[k]), col, name});
  }
  const pos = series.flatMap(s => s.c).filter(v => v > 0), lo = Math.log10(Math.min(...pos)), hi = Math.log10(Math.max(...pos));
  const x = v => m.l + (v - E[0]) / (E[B] - E[0]) * (W - m.l - m.r);
  const y = v => v > 0 ? m.t + (hi - Math.log10(v)) / ((hi - lo) || 1) * (Ht - m.t - m.b) : Ht - m.b;
  const F = 'font-family="IBM Plex Mono, ui-monospace, monospace"';
  let s = `<svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="Activation histogram">`;
  for(let e = Math.ceil(lo); e <= Math.floor(hi); e++){
    s += `<line x1="${m.l}" x2="${W-m.r}" y1="${y(10**e)}" y2="${y(10**e)}" stroke="var(--line)"/><text x="${m.l-6}" y="${y(10**e)+4}" text-anchor="end" font-size="10.5" fill="var(--muted)" ${F}>1e${e}</text>`;
  }
  for(let i = 0; i <= 4; i++){ const v = E[0] + i * (E[B] - E[0]) / 4; s += `<text x="${x(v)}" y="${Ht-m.b+15}" text-anchor="middle" font-size="10.5" fill="var(--muted)" ${F}>${+v.toPrecision(3)}</text>`; }
  for(const S of series){
    const d = S.c.map((v,i) => `${i?'L':'M'}${x(E[i])},${y(v)}H${x(E[i+1])}`).join('');
    s += S.fill ? `<path d="M${x(E[0])},${Ht-m.b}${d.replace(/^M/,'L')}V${Ht-m.b}Z" fill="var(--soft)" stroke="${S.col}" stroke-width="1"/>`
                : `<path d="${d}" fill="none" stroke="${S.col}" stroke-width="1.6"/>`;
  }
  if(H.thr != null) s += `<line x1="${x(H.thr)}" x2="${x(H.thr)}" y1="${m.t}" y2="${Ht-m.b}" stroke="var(--ink)" stroke-dasharray="3 3"/><text x="${x(H.thr)+4}" y="${m.t+10}" font-size="10.5" fill="var(--ink)" ${F}>bout threshold</text>`;
  s += '</svg>';
  const lg = series.map(S => `<span><span class="dot" style="background:${S.col}"></span>${S.name}</span>`).join('');
  return `<div class="lg">${lg}</div><div class="chart">${s}</div>`;
}
/* ---- arena map: n.arena = {rows, cols, act:[rows*cols], occ?:[rows*cols], bg?} ---- */
function turbo(t){
  t = Math.max(0, Math.min(1, t));
  const r = 0.13572138 + t*(4.61539260 + t*(-42.66032258 + t*(132.13108234 + t*(-152.94239396 + t*59.28637943))));
  const g = 0.09140261 + t*(2.19418839 + t*(4.84296658 + t*(-14.18503333 + t*(4.27729857 + t*2.82956604))));
  const b = 0.10667330 + t*(12.64194608 + t*(-60.58204836 + t*(110.36276771 + t*(-89.90310912 + t*27.34824973))));
  return [r, g, b].map(v => Math.round(255 * Math.max(0, Math.min(1, v))));
}
function drawArena(A){
  const c = $('#arenaC'); if(!c) return;
  c.width = A.cols; c.height = A.rows;
  const v = state.arena==='occ' && A.occ ? A.act.map((x,i) => A.occ[i] > 0 ? x / A.occ[i] : 0) : A.act;
  const sorted = [...v].sort((p,q)=>p-q), lo = sorted[0], hi = sorted[Math.floor(0.99 * (sorted.length - 1))] || 1;
  const g = c.getContext('2d'), im = g.createImageData(A.cols, A.rows), al = A.bg ? 170 : 255;
  v.forEach((x,i) => { const [r,gg,b] = turbo((x - lo) / ((hi - lo) || 1)); im.data.set([r,gg,b,al], 4*i); });
  g.putImageData(im, 0, 0);
}

function chart(T, hl){
  const W=460,H=220,m={l:48,r:10,t:10,b:38}; let lo=Math.min(0,...T.map(t=>t.lo)), hi=Math.max(...T.map(t=>t.hi));
  const step=niceStep((hi-lo)/4); lo=Math.floor(lo/step)*step; hi=Math.ceil(hi/step)*step;
  const bw=(W-m.l-m.r)/6, x=s=>m.l+(s-0.5)*bw, y=v=>m.t+(hi-v)*(H-m.t-m.b)/(hi-lo);
  const F='font-family="IBM Plex Mono, ui-monospace, monospace"';
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Per-video mean activation by stage and genotype">`;
  for(const st of hl) s+=`<rect x="${x(st)-bw/2}" y="${m.t}" width="${bw}" height="${H-m.t-m.b}" fill="var(--shade)"/>`;
  for(let v=lo; v<=hi+step/2; v+=step){
    s+=`<line x1="${m.l}" x2="${W-m.r}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/>`;
    s+=`<text x="${m.l-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)" ${F}>${+v.toPrecision(3)}</text>`;
  }
  for(let st=1;st<=6;st++){
    s+=`<text x="${x(st)}" y="${H-m.b+15}" text-anchor="middle" font-size="11" fill="var(--ink)" ${F}>${st}</text>`;
    s+=`<text x="${x(st)}" y="${H-m.b+29}" text-anchor="middle" font-size="10" fill="var(--muted)" ${F}>${STAGE[st]}</text>`;
  }
  for(const [g,dx] of [['wt',-8],['het',8]]){
    const pts=T.filter(t=>t.genotype===g).sort((p,q)=>p.stage-q.stage);
    s+=`<polyline fill="none" stroke="var(--${g})" stroke-width="1.2" stroke-opacity=".45" points="${pts.map(t=>`${x(t.stage)+dx},${y(t.mean)}`).join(' ')}"/>`;
    for(const t of pts){
      s+=`<line x1="${x(t.stage)+dx}" x2="${x(t.stage)+dx}" y1="${y(t.lo)}" y2="${y(t.hi)}" stroke="var(--${g})" stroke-width="2"/>`;
      s+=`<circle cx="${x(t.stage)+dx}" cy="${y(t.mean)}" r="3.8" fill="var(--${g})" stroke="#fff" stroke-width="1.2"><title>${g}, stage ${t.stage}: ${t.mean.toPrecision(3)} [${t.lo.toPrecision(3)}, ${t.hi.toPrecision(3)}], ${t.n_pools} pools</title></circle>`;
    }
  }
  return s+'</svg>';
}

function renderDetail(){
  const D=$('#detail'), j=state.neuron, n=NE()[j];
  if(j===null || !n){ D.innerHTML=''; return; }
  const cmp = state.view==='cmp', a = analysis(state.aid);
  const r = cmp ? res().rows.find(x=>x.neuron===j) : null;
  const hits = allFound().find(x=>x.neuron===j);
  let h=`<div class="dh"><div class="l"><h2>Neuron ${j}</h2>
    <span class="facts"><span class="tip" title="Fraction of all 2.59 M frames where the neuron is active">fires ${(n.firing_rate*100).toFixed(1)}%</span>`;
  if(r) h+=` · <span class="tip ${r.tau>0?'up':'down'}" title="${TAU_TIP}">τ ${fmtTau(r.tau)} ${esc(outcome().unit)}</span> · <span class="tip" title="${P_TIP}">p ${fmtP(r.p)}</span>`;
  h+=`</span></div>`;
  if(hits) h+=`<div class="tags" aria-label="Found in">${hits.hits.map(({a:b,r:x})=>`<button type="button" class="tag ${cmp&&b.id===state.aid?'cur':x.tau>0?'up':'down'}" data-aid="${b.id}" title="${esc(longLabel(b))}: tau ${fmtTau(x.tau)} ${esc(outcome().unit)}, p ${fmtP(x.p)}. Open this comparison">${shortLabel(b)}${x.tau>0?'▲':'▼'}</button>`).join('')}</div>`;
  h+='</div>';
  if(n.artefact) h+=`<div class="warnbox">⚠ Likely artefact: ${esc(DATA.artefact_text[j]||'')}</div>`;
  const cd = outcome().codes, N = state.nclips, L = state.len, C = n.clips[L], w = M.lengths[L];
  const LAB = {frame:'frame', '1s':'1 s', '3s':'3 s'};
  const seg = (k, key, vals, fmt) => `<span class="seg">${vals.map(v=>`<button type="button" data-${k}="${v}" aria-pressed="${String(state[key])===String(v)}">${fmt(v)}</button>`).join('')}</span>`;
  const barTip = `Bar under each tile: the neuron's activation (codes_${cd}) in the frame shown; same scale in every row and length, full width = the neuron's highest frame.${n.bout_thr_bar!=null?' White tick = bout threshold.':''}`;
  const grid = (id, av) => `<div class="cgrid" id="${id}" title="${esc(barTip)}">${Array.from({length:N},(_,i)=> i<av
      ? `<div class="clip"><canvas width="${M.tile}" height="${M.tile}"></canvas><span class="rk">${i+1}</span></div>`
      : `<div class="clip miss">#${i+1}<br>no more videos</div>`).join('')}</div>`;
  const what = L==='frame' ? 'frame' : 'window';
  const topTip = L==='frame'
    ? `The ${M.K} highest single frames of this neuron (codes_${cd}), at most one per video: each video's highest frame, videos ranked by it.`
    : `Windows of ${w} consecutive frames (${LAB[L]} at 5 fps). In each video, the window with the highest MEAN activation (codes_${cd}) over its ${w} frames; the ${M.K} videos with the highest such mean, ranked. Sustained events, not one-frame peaks.`;
  const silent = C.least_rule==='silent';
  const leastTip = silent
    ? `${L==='frame'?'Frames':`Windows of ${w} consecutive frames`} where the neuron is exactly 0${L==='frame'?'':' on every frame'} (codes_${cd}): one picked at random in each of ${M.K} random videos (fixed seed).`
    : `Fewer than ${M.K} videos contain a ${what} where the neuron is 0${L==='frame'?'':' on every frame'}, so these are the ${M.K} videos whose lowest-mean ${what} is lowest, that ${what} in each. Not silent: the neuron is weakly active here.`;
  const heatTip = `Heat colours use one scale for every row and length of this neuron: full colour = ${n.heat_vmax}, the 99th percentile of its positive per-patch activations over all frames shown here.`;
  h+=`<div class="clipbar">
      <span class="opt">Clips${seg('n','nclips',[4,8,16],v=>v)}</span>
      <span class="opt"><span class="tip" title="What is selected and shown: single frames, or windows of 5 (1 s) or 15 (3 s) consecutive frames ranked by their mean activation">Length</span>${seg('l','len',Object.keys(M.lengths),v=>LAB[v])}</span>
      <label class="switch tip" for="heat" title="${esc(heatTip)}"><input type="checkbox" id="heat"${state.heat?' checked':''}> Show where it fires</label>
    </div>
    <div class="hd"><div class="row"><h3 class="tip" title="${esc(topTip)}">Most activated</h3><span class="meta">${L==='frame'?'highest frames':`highest ${LAB[L]} mean`}, 1 per video</span></div>${grid('gTop', C.n_top)}</div>
    <div class="hd"><div class="row"><h3 class="tip" title="${esc(leastTip)}">Least activated${silent?'':' · lowest (not silent)'}</h3><span class="meta">${silent?`0 on every frame, random, 1 per video`:`lowest mean, 1 per video`}</span></div>${grid('gLeast', C.n_least)}</div>
    <div class="srcv">${L==='frame' ? `<img id="vM" src="${C.src}" alt="">` : `<video id="vM" src="${C.src}" muted loop autoplay playsinline preload="auto"></video>`}</div>`;
  const hl = cmp ? (a.family==='A' ? a.stages : [a.stage]) : [], ct = chartTable(j, n);
  const HT = `Share of all frames at each activation level (codes_${cd}), log scale.`;
  const AT = `Mean activation of this neuron on each image patch over ${DATA.arena_note || 'all frames'}. The camera is fixed, so each patch is a fixed spot in the arena.`;
  const occ = state.arena==='occ' && n.arena && n.arena.occ;
  const AN = occ ? `Per occupancy: the mean activation divided by how often a mouse is at that spot. High where, when a mouse is there, the concept fires strongly; this removes the effect of mice simply preferring some spots.`
                 : `Mean: the average activation of this neuron at each spot of the arena over all sampled frames. High where the concept often happens; it mixes "mice are often here" and "the concept fires here".`;
  h+=`<div class="two">
    <div class="hd"><h3 class="tip" title="${esc(HT)}">Activation histogram</h3>
      <p class="note">Share of frames at each activation level (log scale). The spike at 0 = frames where the concept is absent${n.hist && n.hist.thr!=null?'; the dashed line = the threshold that defines a bout':''}. A heavier right tail in one coloured curve = the concept occurs more often or more strongly in that group.</p>
      ${n.hist ? histSVG(n, cmp ? a : null) : '<div class="pend">waiting for data</div>'}</div>
    <div class="hd"><div class="row"><h3 class="tip" title="${esc(AT)}">Arena map</h3>${n.arena && n.arena.occ ? `<span class="seg" id="arSeg"><button type="button" data-ar="raw" aria-pressed="${state.arena!=='occ'}">mean</button><button type="button" data-ar="occ" aria-pressed="${state.arena==='occ'}" title="Mean activation divided by how often a mouse is on that spot">per occupancy</button></span>` : ''}</div>
      <p class="note">${esc(AN)}</p>
      ${n.arena ? `<div class="arena">${n.arena.bg ? `<img class="bg" src="${n.arena.bg}" alt="">` : ''}<canvas id="arenaC"></canvas></div><div class="scale">low <i></i> high</div>` : '<div class="pend">waiting for data</div>'}</div>
  </div>`;
  h+=`<div class="two"><div class="chart"><h3 class="tip" title="${esc(ct.what)}: mean ± 95% CI over 36 pools; shaded = current comparison">By stage and genotype · ${esc(ct.what.split(' (')[0])}</h3>
      <div class="lg"><span><span class="dot" style="background:var(--wt)"></span>wt</span><span><span class="dot" style="background:var(--het)"></span>het</span></div>
      ${chart(ct.T,hl)}</div>
    <div class="chart"><h3 class="tip" title="NES tests these per-pool values; a consistent shift across pools can be significant even when the frame-level histograms overlap.">Per-pool ${cmp && a.family==='B' ? 'values' : 'change'}</h3>${cmp ? poolPanel(j, a) : '<div class="pend">Open a comparison to see the values it tests</div>'}</div></div>`;
  D.innerHTML = h+'</div>';
  if(n.arena) drawArena(n.arena);
  for(const b of D.querySelectorAll('[data-ar]')) b.onclick=()=>{ state.arena=b.dataset.ar; render(); };
  for(const b of D.querySelectorAll('.tags .tag')) b.onclick=()=>{ state.view='cmp'; state.aid=b.dataset.aid; render(); };
  for(const b of D.querySelectorAll('[data-n]')) b.onclick=()=>{ state.nclips=+b.dataset.n; render(); };
  for(const b of D.querySelectorAll('[data-l]')) b.onclick=()=>{ state.len=b.dataset.l; render(); };
  $('#heat').onchange=e=>{ state.heat=e.target.checked; save(); };
  for(const g of D.querySelectorAll('.cgrid')) dragScroll(g);
  startClips();
}

/* ---- per-pool panel: the per-video values the NES test uses (DATA.videos order) ---- */
function meanCI(v){
  const n = v.length, m = v.reduce((p,q)=>p+q,0)/n;
  const sd = n>1 ? Math.sqrt(v.reduce((p,q)=>p+(q-m)**2,0)/(n-1)) : 0, h = n>1 ? (ALL.tcrit[n]||1.96)*sd/Math.sqrt(n) : 0;
  return {n, m, lo:m-h, hi:m+h};
}
function poolPanel(j, a){
  const V = (DATA.vals[state.outcome]||{})[j];
  if(!V) return '<div class="pend">no per-video values for this neuron</div>';
  const u = outcome().unit, rows = [];
  let axis, lg;
  if(a.family==='A'){
    const [s0, s1] = a.stages, by = {};
    DATA.videos.forEach(([p,s,g],i) => { if(g===a.genotype && (s===s0||s===s1)) (by[p] = by[p]||{})[s] = V[i]; });
    const d = Object.values(by).filter(x => x[s0]!=null && x[s1]!=null).map(x => x[s1]-x[s0]);
    rows.push({name:a.genotype, col:`var(--${a.genotype})`, v:d});
    axis = `stage ${s1} − stage ${s0} (${u})`; lg = `each dot = one ${a.genotype} pool: its change from stage ${s0} to stage ${s1}`;
  } else {
    for(const g of ['wt','het']) rows.push({name:g, col:`var(--${g})`, v:DATA.videos.map(([p,s,gg],i)=>(gg===g&&s===a.stage)?V[i]:null).filter(x=>x!=null)});
    axis = `stage ${a.stage} value (${u})`; lg = `each dot = one video (one pool) in stage ${a.stage}`;
  }
  const W=460, rh=46, m={l:44,r:12,t:8,b:34}, H=m.t+rows.length*rh+m.b;
  for(const r of rows) r.s = meanCI(r.v);
  const all = rows.flatMap(r=>[...r.v, r.s.lo, r.s.hi]);
  let lo = Math.min(0,...all), hi = Math.max(0,...all); const step = niceStep((hi-lo)/4||1e-3);
  lo = Math.floor(lo/step)*step; hi = Math.ceil(hi/step)*step; if(hi===lo) hi = lo+step;
  const x = v => m.l + (v-lo)/(hi-lo)*(W-m.l-m.r), F = 'font-family="IBM Plex Mono, ui-monospace, monospace"';
  let s = `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Per-pool values">`;
  for(let v=lo; v<=hi+step/2; v+=step) s += `<line x1="${x(v)}" x2="${x(v)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--line)"/><text x="${x(v)}" y="${H-m.b+14}" text-anchor="middle" font-size="10.5" fill="var(--muted)" ${F}>${+v.toPrecision(3)}</text>`;
  s += `<line x1="${x(0)}" x2="${x(0)}" y1="${m.t}" y2="${H-m.b}" stroke="var(--ink)" stroke-dasharray="3 3"/>`;
  s += `<text x="${(m.l+W-m.r)/2}" y="${H-4}" text-anchor="middle" font-size="10.5" fill="var(--muted)" ${F}>${esc(axis)}</text>`;
  rows.forEach((r,k) => {
    const y0 = m.t + k*rh + rh/2;
    s += `<text x="${m.l-6}" y="${y0+4}" text-anchor="end" font-size="11" fill="var(--ink)" ${F}>${r.name}</text>`;
    r.v.forEach((v,i) => { s += `<circle cx="${x(v)}" cy="${y0 - 12 + ((i*0.618034)%1)*24}" r="2.6" fill="${r.col}" fill-opacity=".5"/>`; });
    s += `<line x1="${x(r.s.lo)}" x2="${x(r.s.hi)}" y1="${y0}" y2="${y0}" stroke="var(--ink)" stroke-width="2.5"/><line x1="${x(r.s.m)}" x2="${x(r.s.m)}" y1="${y0-10}" y2="${y0+10}" stroke="var(--ink)" stroke-width="2.5"><title>${r.name}: mean ${r.s.m.toPrecision(3)} [${r.s.lo.toPrecision(3)}, ${r.s.hi.toPrecision(3)}], n = ${r.s.n}</title></line>`;
  });
  s += '</svg>';
  const sm = rows.map(r => `${r.name} ${r.s.m.toPrecision(3)} [${r.s.lo.toPrecision(3)}, ${r.s.hi.toPrecision(3)}], n ${r.s.n}`).join(' · ');
  return `<div class="lg"><span>${esc(lg)}; black = mean and 95% CI; dashed = 0</span></div>${s}<p class="note mono">${esc(sm)}</p><p class="note">Raw values. A round-1 τ is exactly this contrast; a later-round τ is adjusted for the neurons selected before it, so it can differ.</p>`;
}

/* Each montage (one per neuron x length) holds four blocks of M.K tiles (M.tile px, M.cols per row,
   row-major): top, top with heat, least, least with heat. One hidden <video> (or <img> for single
   frames); every frame, each tile of the shown blocks is copied into its own canvas. */
let clipRAF = null;
function dragScroll(el){
  let x0 = 0, s0 = 0, on = false;
  el.addEventListener('pointerdown', e => { if(e.pointerType!=='mouse') return; on = true; x0 = e.clientX; s0 = el.scrollLeft; el.classList.add('drag'); el.setPointerCapture(e.pointerId); });
  el.addEventListener('pointermove', e => { if(on) el.scrollLeft = s0 - (e.clientX - x0); });
  const end = () => { if(!on) return; on = false; el.classList.remove('drag'); };
  el.addEventListener('pointerup', end); el.addEventListener('pointercancel', end);
}
function startClips(){
  if(clipRAF) cancelAnimationFrame(clipRAF);
  const v = $('#vM'); if(!v) return;
  const isImg = v.tagName === 'IMG';
  const cTop = [...document.querySelectorAll('#gTop canvas')], cLeast = [...document.querySelectorAll('#gLeast canvas')];
  const T = M.tile, BAR = T - 8;
  const nn = NE()[state.neuron], thr = nn && nn.bout_thr_bar != null ? nn.bout_thr_bar : null;   // bout threshold on the bar scale (0..1)
  const off = document.createElement('canvas'), ox = off.getContext('2d', {willReadFrequently:true});
  if(!isImg){ v.muted = true; const p = v.play(); if(p && p.catch) p.catch(()=>{}); }
  let last = null;
  const draw = () => {
    const W = isImg ? v.naturalWidth : v.videoWidth, H = isImg ? v.naturalHeight : v.videoHeight;
    if(isImg ? !(v.complete && W) : v.readyState < 2) return;
    const key = `${state.heat}|${isImg ? 0 : v.currentTime}`;
    if(key === last) return; last = key;
    const cols = Math.max(1, Math.round(W / T));
    if(off.width !== W || off.height !== H){ off.width = W; off.height = H; }
    ox.drawImage(v, 0, 0);
    const put = (cs, name) => { const b = M.blocks.indexOf(name); cs.forEach((c, i) => {
      const t = b * M.K + i, sx = (t % cols) * T, sy = Math.floor(t / cols) * T, g = c.getContext('2d');
      g.drawImage(off, sx, sy, T, BAR, 0, 0, T, BAR);
      // Burnt-in bar (bottom 5 rows of each tile, orange or blue by row) is re-read at row T-4 and redrawn in one style.
      const px = ox.getImageData(sx, sy + T - 4, T, 1).data;
      let w = 0; for(let x = 0; x < T; x++){ const r = px[4*x], gg = px[4*x+1], bb = px[4*x+2]; if(Math.max(r,gg,bb) - Math.min(r,gg,bb) > 60) w = x + 1; else break; }
      g.fillStyle = '#2b2b2b'; g.fillRect(0, BAR, T, T - BAR);
      g.fillStyle = '#f8af18'; g.fillRect(0, BAR + 1, w, T - BAR - 1);
      if(thr != null){ const tx = Math.round(thr * T); g.fillStyle = '#ffffff'; g.fillRect(Math.min(T - 2, tx), BAR - 2, 2, T - BAR + 2); }
    }); };
    put(cTop, state.heat ? 'top_heat' : 'top'); put(cLeast, state.heat ? 'least_heat' : 'least');
  };
  const tick = () => {
    if(!document.body.contains(v)) return;
    draw();
    clipRAF = requestAnimationFrame(tick);
  };
  tick();
}

function render(){
  buildControls();
  if(state.view==='cmp') renderCmpList(); else renderAllList();
  renderDetail(); save();
}
render();
