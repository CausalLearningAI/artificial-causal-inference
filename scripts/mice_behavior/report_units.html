<!-- Outcome-unit distributions. Injected by build_report.py, which replaces the __UNITS_JSON__
     token with the `dist` block of results/vision/mice/frame/_figures/outcome.json (written by
     build_outcome.py). Kept out of report_body.py because that file is one big f-string and JS
     braces in it would need doubling everywhere.

     Two columns, one row per behaviour: how many events a recording holds, and how long one
     event lasts. No toggles and no interpretation block -- the prose next to it does that. -->
<style>
.un{--u-bar:var(--accent);--u-surface:var(--surface);--u-grid:var(--line)}
.un{border:1px solid var(--line);border-radius:3px;background:var(--u-surface);
    margin:18px 0 0;overflow:hidden}
.un-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:14px 16px 16px}
@media(max-width:900px){.un-grid{grid-template-columns:1fr}}
.un-cell{min-width:0;padding-top:10px}
.un-cell.rowtop{border-top:1px solid var(--line);margin-top:10px}
.un svg{width:100%;height:auto;display:block;overflow:visible}
.un-tt{position:fixed;pointer-events:none;z-index:50;opacity:0;transition:opacity .1s;
       background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.7rem;
       line-height:1.55;padding:8px 10px;border-radius:3px;max-width:280px;white-space:normal}
</style>

<div class="un" id="un"><div class="un-grid" id="un-grid"></div></div>
<div class="un-tt" id="un-tt" role="status" aria-live="polite"></div>

<script>
(function () {
  const D = __UNITS_JSON__;
  const M = D.meta;
  const BEH = [['nt', 'nose-to-tail'], ['nn', 'nose-to-nose']];

  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle($('un')).getPropertyValue(n).trim();
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };
  const txt = (s, a) => { const t = el('text', Object.assign(
    { 'font-family': 'ui-monospace,monospace' }, a)); t.textContent = s; return t; };
  const pct = (x) => (100 * x).toFixed(1) + '%';

  function tip(node, html) {
    const tt = $('un-tt');
    const show = (ev) => {
      tt.innerHTML = html; tt.style.opacity = '1';
      const r = tt.getBoundingClientRect();
      tt.style.left = Math.min((ev.clientX ?? 0) + 14, innerWidth - r.width - 10) + 'px';
      tt.style.top = Math.min((ev.clientY ?? 0) + 14, innerHeight - r.height - 10) + 'px';
    };
    node.addEventListener('mouseenter', show);
    node.addEventListener('mousemove', show);
    node.addEventListener('focus', () => { const b = node.getBoundingClientRect();
      show({ clientX: b.left + b.width / 2, clientY: b.top }); });
    const hide = () => { $('un-tt').style.opacity = '0'; };
    node.addEventListener('mouseleave', hide);
    node.addEventListener('blur', hide);
  }

  function ticks(hi, n) {
    const raw = hi / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || mag * 10;
    const out = []; for (let t = 0; t <= hi + 1e-9; t += step) out.push(+t.toFixed(10));
    return out;
  }

  const W = 575, L = 46, R = 14, TOP = 28, PH = 172, AX = 40, H = TOP + PH + AX;

  function frame(title, ydom, nTick) {
    /* Shared chrome, so the two panels cannot drift apart in spacing or type size. */
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}` });
    const y = (v) => TOP + PH - v / ydom * PH;
    ticks(ydom, nTick).forEach(t => {
      svg.appendChild(el('line', { x1: L, x2: W - R, y1: y(t), y2: y(t),
        stroke: css('--u-grid'), 'stroke-width': t === 0 ? 1.4 : 0.8 }));
      svg.appendChild(txt(t, { x: L - 8, y: y(t) + 3.5, 'text-anchor': 'end',
        fill: css('--ink-3'), 'font-size': 10.5 }));
    });
    svg.appendChild(txt(title, { x: L, y: 12, fill: css('--ink-2'), 'font-size': 12,
      'font-weight': 600 }));
    return { svg, y };
  }

  function bars(svg, y, n, vals, colour, hit) {
    const bw = (W - L - R) / n;
    vals.forEach((v, i) => {
      if (v > 0) svg.appendChild(el('rect', { x: L + i * bw + 1, y: y(v), width: bw - 2,
        height: y(0) - y(v), fill: colour, opacity: 0.78 }));
      const g = el('g', { tabindex: 0, role: 'button' });
      g.appendChild(el('rect', { x: L + i * bw, y: TOP, width: bw, height: PH,
        fill: 'transparent' }));
      tip(g, hit(i, v));
      svg.appendChild(g);
    });
    return bw;
  }

  function xaxis(svg, label) {
    svg.appendChild(el('line', { x1: L, x2: W - R, y1: TOP + PH, y2: TOP + PH,
      stroke: css('--u-grid'), 'stroke-width': 1.4 }));
    svg.appendChild(txt(label, { x: (L + W - R) / 2, y: TOP + PH + 34, 'text-anchor': 'middle',
      fill: css('--ink-3'), 'font-size': 10.5 }));
  }

  // ------------------------------------------------------- left: events per recording
  function countPanel(key, nice) {
    const c = D.counts[key].per_rec, n = c.hist.length;
    const { svg, y } = frame(`${nice} — events per recording`, Math.max(...c.hist, 1), 4);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `${nice}: distribution of bouts per recording over `
      + `${M.n_obs} recordings; median ${c.median}, ${c.zero} with none.`);
    const bw = bars(svg, y, n, c.hist, css('--u-bar'), (i, v) =>
      `<b>${c.edges[i]}–${c.edges[i + 1]} bouts</b><br>`
      + `${v} of ${M.n_obs} recordings (${pct(v / M.n_obs)})`);
    for (let i = 0; i <= n; i += Math.max(1, Math.round(n / 7))) {
      svg.appendChild(txt(c.edges[i], { x: L + i * bw, y: TOP + PH + 16,
        'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10 }));
    }
    xaxis(svg, `bouts in the recording  ·  median ${c.median}, `
      + `${c.zero} of ${M.n_obs} recordings hold none`);
    return svg;
  }

  // ------------------------------------------------------- right: bout length
  function lenPanel(key, nice) {
    const d = D.lengths[key], n = d.buckets.length;
    const { svg, y } = frame(`${nice} — length of one event`, Math.max(...d.n_bouts, 1), 4);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label', `${nice}: bout length in frames. `
      + `${pct(d.one_frame)} of bouts last a single frame.`);
    const bw = bars(svg, y, n, d.n_bouts, css('--u-bar'), (i, v) =>
      `<b>${d.buckets[i]} frame${d.buckets[i] === '1' ? '' : 's'}`
      + `${d.buckets[i].endsWith('+') ? '' : ` (${(+d.buckets[i] / M.fps).toFixed(1)} s)`}</b><br>`
      + `${v} bouts — ${pct(d.share_bouts[i])} of all bouts<br>`
      + `holding ${pct(d.share_time[i])} of all time in the behaviour`);
    d.buckets.forEach((b, i) => {
      if (n <= 18 || i % 2 === 0) svg.appendChild(txt(b, { x: L + i * bw + bw / 2,
        y: TOP + PH + 16, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10 }));
    });
    xaxis(svg, `length in frames at ${M.fps} fps  ·  median ${d.median}, p90 ${d.p90}, `
      + `longest ${d.max}  ·  ${d.n} bouts`);
    return svg;
  }

  const grid = $('un-grid');
  BEH.forEach(([k, nice], r) => {
    [countPanel(k, nice), lenPanel(k, nice)].forEach(svg => {
      const div = document.createElement('div');
      div.className = 'un-cell' + (r ? ' rowtop' : '');
      div.appendChild(svg); grid.appendChild(div);
    });
  });
})();
</script>
