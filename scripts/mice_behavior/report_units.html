<!-- Interactive outcome-unit distributions. Injected by build_report.py, which replaces the
     __UNITS_JSON__ token with the `dist` block of results/vision/mice/frame/_figures/outcome.json
     (written by build_outcome.py). Kept out of report_body.py because that file is one big
     f-string and JS braces in it would need doubling everywhere.

     Two columns, one row per behaviour:
       left   how many events a recording contains -- the numerator's distribution
       right  how long one event lasts, as a share of BOUTS against a share of TIME. The gap
              between those two series IS the argument for counts over occupancy, so they are
              drawn as paired bars on one axis rather than in separate panels. -->
<style>
.un{--u-bout:var(--accent);--u-time:var(--warm);--u-surface:var(--surface);--u-grid:var(--line)}
.un{border:1px solid var(--line);border-radius:3px;background:var(--u-surface);
    margin:18px 0 0;overflow:hidden}
.un-bar{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;padding:14px 16px;
        border-bottom:1px solid var(--line);background:var(--surface-2)}
.un-ctl{display:flex;flex-direction:column;gap:5px}
.un-ctl .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
             color:var(--ink-3)}
.un-seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.un-seg button{font-family:var(--mono);font-size:.72rem;padding:5px 11px;border:0;cursor:pointer;
               background:var(--surface);color:var(--ink-2);line-height:1.3}
.un-seg button+button{border-left:1px solid var(--line)}
.un-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.un-legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px 0;font-family:var(--mono);
           font-size:.72rem;color:var(--ink-2)}
.un-legend span{display:inline-flex;align-items:center;gap:7px}
.un-legend i{width:11px;height:11px;border-radius:2px;display:inline-block}
.un-grid{display:grid;grid-template-columns:1fr 1fr;gap:0 22px;padding:4px 16px 0}
@media(max-width:900px){.un-grid{grid-template-columns:1fr}}
.un-cell{min-width:0;padding-top:12px}
.un-cell.rowtop{border-top:1px solid var(--line);margin-top:8px}
.un svg{width:100%;height:auto;display:block;overflow:visible}
.un-note{font-family:var(--mono);font-size:.72rem;line-height:1.6;color:var(--ink-3);
         padding:12px 16px 16px}
.un-tt{position:fixed;pointer-events:none;z-index:50;opacity:0;transition:opacity .1s;
       background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.7rem;
       line-height:1.55;padding:8px 10px;border-radius:3px;max-width:290px;white-space:normal}
.un-tbl{padding:0 16px 16px}
.un-tbl[hidden]{display:none}
.un-tbl h5{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
           color:var(--ink-3);font-weight:400;margin:14px 0 7px}
</style>

<div class="un" id="un">
  <div class="un-bar" id="un-bar"></div>
  <div class="un-legend" id="un-legend"></div>
  <div class="un-grid" id="un-grid"></div>
  <div class="un-note" id="un-note"></div>
  <div class="un-tbl" id="un-tbl" hidden></div>
</div>
<div class="un-tt" id="un-tt" role="status" aria-live="polite"></div>

<script>
(function () {
  const D = __UNITS_JSON__;
  const M = D.meta;
  const BEH = [['nt', 'nose-to-tail'], ['nn', 'nose-to-nose']];
  const PHN = { H: 'habituation', O: 'exposure', P: 'post' };
  const state = { den: 'per_min', table: false };

  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle($('un')).getPropertyValue(n).trim();
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };
  const txt = (s, a) => { const t = el('text', Object.assign(
    { 'font-family': 'ui-monospace,monospace' }, a)); t.textContent = s; return t; };
  const pct = (x) => (100 * x).toFixed(1) + '%';
  const denLabel = () => state.den === 'per_min' ? 'bouts per minute' : 'bouts per recording';

  function tip(node, html) {
    const tt = $('un-tt');
    const show = (ev) => {
      tt.innerHTML = html; tt.style.opacity = '1';
      const r = tt.getBoundingClientRect();
      tt.style.left = Math.min((ev.clientX ?? 0) + 14, innerWidth - r.width - 10) + 'px';
      tt.style.top = Math.min((ev.clientY ?? 0) + 14, innerHeight - r.height - 10) + 'px';
    };
    node.addEventListener('mouseenter', show);
    node.addEventListener('mousemove', show);
    node.addEventListener('focus', () => { const b = node.getBoundingClientRect();
      show({ clientX: b.left + b.width / 2, clientY: b.top }); });
    const hide = () => { $('un-tt').style.opacity = '0'; };
    node.addEventListener('mouseleave', hide);
    node.addEventListener('blur', hide);
  }

  function seg(label, key, opts) {
    const wrap = document.createElement('div'); wrap.className = 'un-ctl';
    const l = document.createElement('span'); l.className = 'lab'; l.textContent = label;
    const box = document.createElement('div'); box.className = 'un-seg';
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', label);
    opts.forEach(([val, t]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t;
      b.setAttribute('aria-pressed', String(state[key] === val));
      b.onclick = () => { state[key] = val; render(); };
      box.appendChild(b);
    });
    wrap.append(l, box); return wrap;
  }

  function ticks(hi, n) {
    const raw = hi / n, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || mag * 10;
    const out = []; for (let t = 0; t <= hi + 1e-9; t += step) out.push(+t.toFixed(10));
    return out;
  }

  const W = 575, L = 50, R = 14, TOP = 30, PH = 186, AX = 58, H = TOP + PH + AX;

  function frame(title, ydom, yfmt, nTick) {
    /* Shared chrome: title, y grid, y axis. Returns the svg and its y scale so the two very
       different panels cannot drift apart in spacing or type size. */
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}` });
    const y = (v) => TOP + PH - v / ydom * PH;
    ticks(ydom, nTick).forEach(t => {
      svg.appendChild(el('line', { x1: L, x2: W - R, y1: y(t), y2: y(t),
        stroke: css('--u-grid'), 'stroke-width': t === 0 ? 1.4 : 0.8 }));
      svg.appendChild(txt(yfmt(t), { x: L - 8, y: y(t) + 3.5, 'text-anchor': 'end',
        fill: css('--ink-3'), 'font-size': 10.5 }));
    });
    svg.appendChild(txt(title, { x: L, y: 13, fill: css('--ink-2'), 'font-size': 12,
      'font-weight': 600 }));
    return { svg, y };
  }

  function xlabel(svg, s) {
    svg.appendChild(txt(s, { x: (L + W - R) / 2, y: TOP + PH + 46, 'text-anchor': 'middle',
      fill: css('--ink-3'), 'font-size': 10.5 }));
    svg.appendChild(el('line', { x1: L, x2: W - R, y1: TOP + PH, y2: TOP + PH,
      stroke: css('--u-grid'), 'stroke-width': 1.4 }));
  }

  // ------------------------------------------------------- left: events per recording
  function countPanel(key, nice) {
    const c = D.counts[key][state.den];
    const hi = Math.max(...c.hist), n = c.hist.length;
    const { svg, y } = frame(`${nice} — how many events a recording holds`,
      Math.max(hi, 1), (t) => t, 4);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label',
      `${nice}: distribution of ${denLabel()} over ${M.n_obs} recordings; median `
      + `${c.median}, ${c.zero} recordings with none.`);
    const bw = (W - L - R) / n;
    c.hist.forEach((v, i) => {
      const g = el('g', { tabindex: 0, role: 'button' });
      if (v > 0) g.appendChild(el('rect', { x: L + i * bw + 1, y: y(v), width: bw - 2,
        height: y(0) - y(v), fill: css('--u-bout'), opacity: 0.72 }));
      g.appendChild(el('rect', { x: L + i * bw, y: TOP, width: bw, height: PH,
        fill: 'transparent' }));
      tip(g, `<b>${c.edges[i]}–${c.edges[i + 1]} ${denLabel()}</b><br>`
        + `${v} of ${M.n_obs} recordings (${pct(v / M.n_obs)})`);
      svg.appendChild(g);
    });
    // the phase medians, as ticks under the axis: the same recording length gives a different
    // count depending on WHEN it was sampled, which is what section 03 is about
    const x = (v) => L + Math.min(v / (c.edges[n] || 1), 1) * (W - L - R);
    ['H', 'O', 'P'].forEach((p, i) => {
      const m = c.by_phase[p]; if (!m) return;
      const g = el('g', { tabindex: 0, role: 'button' });
      g.appendChild(el('line', { x1: x(m.median), x2: x(m.median), y1: TOP + PH,
        y2: TOP + PH + 9, stroke: css('--ink-3'), 'stroke-width': 1.4 }));
      g.appendChild(txt(p, { x: x(m.median), y: TOP + PH + 20, 'text-anchor': 'middle',
        fill: css('--ink-3'), 'font-size': 10 }));
      tip(g, `<b>${p} ${PHN[p]}</b><br>median ${m.median} ${denLabel()}<br>`
        + `mean ${m.mean} over ${m.n} recordings`);
      svg.appendChild(g);
    });
    for (let i = 0; i <= n; i += Math.max(1, Math.round(n / 7))) {
      svg.appendChild(txt(c.edges[i], { x: L + i * bw, y: TOP + PH + 33,
        'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10 }));
    }
    xlabel(svg, `${denLabel()}  ·  median ${c.median}, `
      + `${c.zero} of ${M.n_obs} recordings hold none  ·  ticks = phase medians`);
    return svg;
  }

  // ------------------------------------------------------- right: bout length
  function lenPanel(key, nice) {
    const d = D.lengths[key], n = d.buckets.length;
    const hi = Math.max(...d.share_bouts, ...d.share_time);
    const { svg, y } = frame(`${nice} — how long one event lasts`, hi, pct, 4);
    svg.setAttribute('role', 'img');
    svg.setAttribute('aria-label',
      `${nice}: bout length in frames. ${pct(d.one_frame)} of bouts last a single frame but `
      + `carry only ${pct(d.share_time[0])} of all time in the behaviour.`);
    const bw = (W - L - R) / n, gap = 2.5, half = (bw - 2 * gap) / 2;
    d.buckets.forEach((b, i) => {
      const x0 = L + i * bw + gap;
      [['share_bouts', '--u-bout', 0], ['share_time', '--u-time', half]].forEach(
        ([k, col, off]) => {
          const v = d[k][i]; if (v <= 0) return;
          svg.appendChild(el('rect', { x: x0 + off, y: y(v), width: half,
            height: y(0) - y(v), fill: css(col), opacity: 0.82 }));
        });
      const g = el('g', { tabindex: 0, role: 'button' });
      g.appendChild(el('rect', { x: L + i * bw, y: TOP, width: bw, height: PH,
        fill: 'transparent' }));
      tip(g, `<b>bouts of ${b} frame${b === '1' ? '' : 's'}`
        + `${b.endsWith('+') ? '' : ` (${(+b / M.fps).toFixed(1)} s)`}</b><br>`
        + `${d.n_bouts[i]} bouts — ${pct(d.share_bouts[i])} of all bouts<br>`
        + `${d.time_frames[i]} frames — ${pct(d.share_time[i])} of all time in the `
        + `behaviour<br>cumulative time up to here ${pct(d.cum_time[i])}`);
      svg.appendChild(g);
      if (n <= 18 || i % 2 === 0) svg.appendChild(txt(b, { x: L + i * bw + bw / 2,
        y: TOP + PH + 15, 'text-anchor': 'middle', fill: css('--ink-3'), 'font-size': 10 }));
    });
    xlabel(svg, `bout length, frames at ${M.fps} fps  ·  median ${d.median}, `
      + `p90 ${d.p90}, longest ${d.max}  ·  ${d.n} bouts`);
    return svg;
  }

  function table() {
    const box = $('un-tbl'); box.textContent = ''; box.hidden = !state.table;
    if (!state.table) return;
    BEH.forEach(([k, nice]) => {
      const d = D.lengths[k];
      const h = document.createElement('h5');
      h.textContent = `${nice} · bout length: share of bouts against share of time`;
      const w = document.createElement('div'); w.className = 'scroll';
      w.innerHTML = '<table><thead><tr><th>length, frames</th><th>bouts</th>'
        + '<th>share of bouts</th><th>share of time</th><th>cumulative time</th>'
        + '</tr></thead><tbody>'
        + d.buckets.map((b, i) => `<tr><td>${b}</td><td>${d.n_bouts[i]}</td>`
          + `<td>${pct(d.share_bouts[i])}</td><td>${pct(d.share_time[i])}</td>`
          + `<td>${pct(d.cum_time[i])}</td></tr>`).join('')
        + '</tbody></table>';
      box.append(h, w);
    });
  }

  function render() {
    const bar = $('un-bar'); bar.textContent = '';
    bar.append(seg('denominator', 'den',
                   [['per_min', 'per minute'], ['per_rec', 'per recording']]),
               seg('view', 'table', [[false, 'chart'], [true, 'chart + table']]));

    $('un-legend').innerHTML =
      `<span><i style="background:var(--u-bout)"></i>share of BOUTS</span>`
      + `<span><i style="background:var(--u-time)"></i>share of TIME in the behaviour</span>`
      + `<span style="color:var(--ink-3)">${M.n_obs} annotated recordings, `
      + `${M.n_pools} pools &middot; H 30 min, O and P 15 min each</span>`;

    const grid = $('un-grid'); grid.textContent = '';
    BEH.forEach(([k, nice], r) => {
      [countPanel(k, nice), lenPanel(k, nice)].forEach(svg => {
        const div = document.createElement('div');
        div.className = 'un-cell' + (r ? ' rowtop' : '');
        div.appendChild(svg); grid.appendChild(div);
      });
    });

    const nt = D.lengths.nt, nn = D.lengths.nn;
    $('un-note').innerHTML =
      'Left: the numerator of every estimate in this report. It is a small integer &mdash; the '
      + `median recording holds ${D.counts.nt.per_rec.median} nose-to-tail and `
      + `${D.counts.nn.per_rec.median} nose-to-nose bouts &mdash; and `
      + `${D.counts.nt.per_min.zero} of ${M.n_obs} hold no nose-to-tail bout at all, which is why `
      + 'the decay unit in section 03 is undefined in some cells. The three ticks under the axis '
      + 'are the H, O and P medians: the same count means a different thing depending on WHEN in '
      + 'the protocol it was taken, which is what section 03 is about. '
      + '<br>Right: the two series answer the two different questions a length distribution is '
      + `asked. By COUNT the behaviour is almost all short: ${pct(nn.one_frame)} of nose-to-nose `
      + `bouts and ${pct(nt.one_frame)} of nose-to-tail ones last a single frame, so mean bout `
      + 'DURATION has almost no dynamic range left to carry an effect. By TIME it is the '
      + `opposite: those single-frame bouts hold only ${pct(nn.share_time[0])} and `
      + `${pct(nt.share_time[0])} of the behaviour, and the ${nn.buckets[nn.buckets.length - 1]} `
      + `bucket &mdash; ${pct(nn.share_bouts[nn.buckets.length - 1])} of nose-to-nose bouts `
      + `&mdash; holds ${pct(nn.share_time[nn.share_time.length - 1])} of its time. `
      + `That gap between the blue `
      + 'and orange bars is the reason occupancy is dominated by a handful of long bouts while '
      + 'counts are not.';
    table();
  }
  render();
})();
</script>
