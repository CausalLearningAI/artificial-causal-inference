<!-- Interactive phase-transition ATE figure. Injected by build_report.py, which replaces the
     ESTIMATES_JSON token with results/vision/mice/frame/_figures/estimates.json.
     Kept out of report_body.py on purpose: that file is one big f-string, and JS braces in it
     would need doubling everywhere.

     THREE ESTIMATORS, TWO AXES
     ==========================
       CI     human annotations only               -- v1 only    behaviour scale
       PPI++  human + model annotations            -- v1 only    behaviour scale
       PPCI   model annotations only, UNCALIBRATED -- v1 and v2  MODEL scale

     CI and PPI++ share an axis, so PPI++ can be read against the CI it narrows. PPCI is not
     calibrated to the labels -- predicted rates run above true ones -- so its distance from zero
     is not comparable to theirs, and it gets its OWN axis in every panel. Its sign and its
     pattern across cells are what it claims.

     CONTROLS: experiment (v1 | v2 | all), outcome, behaviour, line, sex, predictor. With
     experiment = all the three genotype groups sit side by side: wt (v1 pure-wt cages), het (v1
     pure-het cages) and mixed (v2 cages, 3 wt + 1 het). The stratum id is built here exactly as
     build_estimates.stratum_id builds it. A combination that cannot carry an estimator (v2 has no
     labels; a stratum with fewer than two annotated pools has no clustered interval) draws an
     explicit "n/a" row naming why, never a blank. -->
<style>
.ate{--s-ci:#2a78d6;--s-ppi:#1baf7a;--s-ppci:#eb6834;
     --ate-surface:var(--surface);--ate-grid:var(--line)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .ate{
     --s-ci:#3987e5;--s-ppi:#199e70;--s-ppci:#d95926}}
:root[data-theme="dark"] .ate{--s-ci:#3987e5;--s-ppi:#199e70;--s-ppci:#d95926}
.ate{border:1px solid var(--line);border-radius:3px;background:var(--ate-surface);
     margin:18px 0 0;overflow:hidden}
.ate-bar{display:flex;flex-wrap:wrap;gap:18px;padding:14px 16px;border-bottom:1px solid var(--line);
         background:var(--surface-2)}
.ate-ctl{display:flex;flex-direction:column;gap:5px}
.ate-ctl .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;text-transform:uppercase;
              color:var(--ink-3)}
.ate-seg{display:flex;gap:0;border:1px solid var(--line);border-radius:3px;overflow:hidden}
.ate-seg button{font-family:var(--mono);font-size:.72rem;padding:5px 10px;border:0;cursor:pointer;
                background:var(--surface);color:var(--ink-2);line-height:1.3}
.ate-seg button+button{border-left:1px solid var(--line)}
.ate-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.ate-seg button:disabled{opacity:.38;cursor:not-allowed}
.ate-pop{position:relative}
.ate-pop-btn{font-family:var(--mono);font-size:.72rem;padding:5px 10px;border:1px solid var(--line);
             border-radius:3px;cursor:pointer;background:var(--surface);color:var(--ink-2);
             line-height:1.3;display:inline-flex;align-items:center;gap:6px}
.ate-pop-btn::after{content:'\25BE';font-size:.6rem;color:var(--ink-3)}
.ate-pop-btn[aria-expanded="true"]{background:var(--accent-soft);color:var(--ink)}
.ate-pop-menu{position:absolute;top:calc(100% + 4px);left:0;z-index:30;min-width:230px;
              display:flex;flex-direction:column;gap:1px;padding:4px;
              background:var(--surface);border:1px solid var(--line);border-radius:3px}
.ate-pop-menu[hidden]{display:none}
.ate-pop-item{font-family:var(--mono);font-size:.72rem;text-align:left;line-height:1.3;
             border:0;border-radius:2px;padding:6px 8px;cursor:pointer;
             background:transparent;color:var(--ink-2)}
.ate-pop-item:hover{background:var(--surface-2)}
.ate-pop-item[aria-pressed="true"]{background:var(--accent);color:#fff}
.ate-legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px 0;font-family:var(--mono);
            font-size:.72rem;color:var(--ink-2)}
.ate-legend span{display:inline-flex;align-items:center;gap:7px}
.ate-legend i{width:11px;height:11px;border-radius:50%;display:inline-block;
              box-shadow:0 0 0 2px var(--ate-surface)}
.ate-panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:0}
.ate-colhead{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;text-transform:uppercase;
             color:var(--ink-2);padding:10px 16px 0}
.ate-panel{padding:6px 16px 16px;min-width:0}
.ate svg{width:100%;height:auto;display:block;overflow:visible}
.ate-note{font-family:var(--mono);font-size:.72rem;line-height:1.6;color:var(--ink-3);
          padding:0 16px 16px}
.ate-tt{position:fixed;pointer-events:none;z-index:50;opacity:0;transition:opacity .1s;
        background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.7rem;
        line-height:1.55;padding:8px 10px;border-radius:3px;max-width:300px;white-space:normal}
.ate-tbl{padding:0 16px 16px}
.ate-tbl[hidden]{display:none}
.ate-empty{font-family:var(--mono);font-size:.75rem;color:var(--ink-3);padding:22px 16px}
.ate-mark{cursor:pointer}
.ate-mark:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>

<div class="ate" id="ate">
  <div class="ate-bar" id="ate-bar"></div>
  <div class="ate-legend" id="ate-legend"></div>
  <div class="ate-panels" id="ate-panels"></div>
  <div class="ate-note" id="ate-note"></div>
  <div class="ate-tbl" id="ate-tbl" hidden></div>
</div>
<div class="ate-tt" id="ate-tt" role="status" aria-live="polite"></div>

<script>
(function () {
  const DATA = __ESTIMATES_JSON__;
  // build_report.py row-packs the grid (one key list, one array per cell); unpack it once
  const cells = DATA.cells || (DATA.rows || []).map(r =>
    Object.fromEntries(DATA.keys.map((k, i) => [k, r[i]])));
  const META = DATA.meta || {};
  const STRATA = META.strata || {};
  const METHODS = [
    { key: 'ci', name: 'CI', long: 'CI (human annotations)', v: '--s-ci',
      why: 'The mean human-scored within-pool difference over the annotated pools. '
           + 'No model anywhere.' },
    { key: 'ppi', name: 'PPI++', long: 'PPI++ (human + AI annotations)', v: '--s-ppi',
      why: 'Adds the unannotated pools, with a rectifier fitted on the annotated ones. '
           + 'Unbiased for ANY predictor, so the model can only move the variance.' },
    { key: 'ppci', name: 'PPCI', long: 'PPCI (AI annotations, own axis)', v: '--s-ppci',
      why: 'The mean MODEL within-pool difference over every pool, uncalibrated. Needs no '
           + 'annotation anywhere, which is why it is the only estimator that exists on v2. '
           + 'On the model’s scale: read its sign and its pattern, not its magnitude.' },
  ];
  const M = Object.fromEntries(METHODS.map(m => [m.key, m]));
  const BLOCKS = [
    { key: 'beh', methods: ['ci', 'ppi'], title: 'behaviour scale · CI, PPI++' },
    { key: 'mod', methods: ['ppci'], title: 'model scale · PPCI, uncalibrated' },
  ];
  const AXIS = { events: 'change in bouts per minute', time: 'change in occupancy (pp)',
                 decay: 'change in decay (mean onset, min)' };
  const AXIS_MODEL = { events: 'change in predicted bouts per minute',
                       time: 'change in predicted occupancy (pp)',
                       decay: 'change in predicted decay (min)' };
  const ODOURS = [['fear', 'FEAR exposure'], ['social', 'SOCIAL exposure']];
  const TRANS = [['H->O', 'ON  H → O'], ['O->P', 'OFF  O → P']];
  const LINES = ['all', 'ash1l', 'kdm6b', 'kmt5b'];
  const SEXES = [['all', 'all'], ['m', 'male'], ['f', 'female']];
  const state = { exp: 'v1', unit: 'events', behav: 'nn', model: null, line: 'all', sex: 'all',
                  table: false };
  const uniq = (k) => [...new Set(cells.map(c => c[k]))];
  /* The default predictor is the DEPLOYED one, READ FROM THE PAYLOAD rather than named here:
     build_estimates.py writes meta.deployed and report_body.py's PRIME reads the same field. */
  const DEPLOYED = META.deployed;
  state.model = uniq('model').includes(DEPLOYED) ? DEPLOYED : uniq('model')[0];
  const MODEL_NICE = Object.assign({}, META.predictors || {}, {
    xfit_dense: 'SSL encoder, ERM',
    xfit_bit6_dense: 'BitFit-6, ERM',
    xfit_derm_dense: 'DERM',
    xfit_derm_ssl_dense: 'SSL encoder, DERM',
    xfit_bit6_derm_dense: 'BitFit-6, DERM',
    xfit_bit6_derm_popw_dense: 'BitFit-6, DERM (pop. weights)',
  });
  const modelName = (m) => (MODEL_NICE[m] || m) + (m === DEPLOYED ? ' • deployed' : '');
  const predictorTag = (m) => {
    const nice = (META.predictors || {})[m] || '';
    const parts = nice.split(/\s+--\s+/);
    return parts.length > 1 ? parts[parts.length - 1].trim() : '';
  };

  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle($('ate')).getPropertyValue(n).trim();
  const fmt = (x, d = 2) => (x == null || !isFinite(x) ? '—'
    : (x >= 0 ? '+' : '−') + Math.abs(x).toFixed(d));
  let closePredPopup = null;
  document.addEventListener('click', (ev) => { if (closePredPopup) closePredPopup(ev); });

  /* Same rule as build_estimates.stratum_id: the non-'all' parts in the order line, genotype,
     sex, joined by '_' -- or 'all'. */
  const sid = (line, geno, sex) => [line, geno, sex].filter(x => x !== 'all').join('_') || 'all';
  /* The groups one view compares. v1 / v2: that cohort's pools in the chosen line and sex.
     all: the three genotype groups side by side, each in the chosen line and sex. */
  function groups() {
    const one = (exp, geno, name) => {
      const id = sid(state.line, geno, state.sex);
      const st = (STRATA[exp] || {})[id] || {};
      return { exp, id, name, n: st.n_pools, k: st.n_annotated || 0 };
    };
    if (state.exp === 'all') {
      return [one('v1', 'wt', 'wt · v1 cages'), one('v1', 'het', 'het · v1 cages'),
              one('v2', 'all', 'mixed · v2 cages')];
    }
    return [one(state.exp, 'all', state.exp)];
  }
  const sexNice = (s) => (SEXES.find(x => x[0] === s) || [s, s])[1];
  const sliceName = () => [state.line === 'all' ? 'all lines' : state.line,
                           state.sex === 'all' ? 'both sexes' : sexNice(state.sex)].join(' · ');

  // ---------------------------------------------------------------- controls
  function seg(label, key, opts) {
    const wrap = document.createElement('div'); wrap.className = 'ate-ctl';
    const l = document.createElement('span'); l.className = 'lab'; l.textContent = label;
    const box = document.createElement('div'); box.className = 'ate-seg';
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', label);
    opts.forEach(([val, txt, dis]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = txt;
      b.setAttribute('aria-pressed', String(state[key] === val));
      if (dis) b.disabled = true;
      b.onclick = () => { state[key] = val; render(); };
      box.appendChild(b);
    });
    wrap.append(l, box); return wrap;
  }
  function predictorPopup(models) {
    const wrap = document.createElement('div'); wrap.className = 'ate-ctl';
    const l = document.createElement('span'); l.className = 'lab'; l.textContent = 'predictor';
    const pop = document.createElement('div'); pop.className = 'ate-pop';
    const btn = document.createElement('button');
    btn.type = 'button'; btn.className = 'ate-pop-btn';
    btn.setAttribute('aria-haspopup', 'true');
    btn.setAttribute('aria-expanded', 'false');
    btn.textContent = modelName(state.model);
    const menu = document.createElement('div');
    menu.className = 'ate-pop-menu'; menu.setAttribute('role', 'group');
    menu.setAttribute('aria-label', 'predictor'); menu.hidden = true;
    const close = () => { menu.hidden = true; btn.setAttribute('aria-expanded', 'false'); };
    const open = () => { menu.hidden = false; btn.setAttribute('aria-expanded', 'true'); };
    btn.onclick = (ev) => {
      if (ev && ev.stopPropagation) ev.stopPropagation();
      if (menu.hidden) open(); else close();
    };
    models.forEach(m => {
      const it = document.createElement('button');
      it.type = 'button'; it.className = 'ate-pop-item';
      it.setAttribute('aria-pressed', String(state.model === m));
      const tag = predictorTag(m);
      it.textContent = (MODEL_NICE[m] || m) + (tag ? '  ·  ' + tag : '');
      it.onclick = (ev) => {
        if (ev && ev.stopPropagation) ev.stopPropagation();
        state.model = m; close(); render();
      };
      menu.appendChild(it);
    });
    closePredPopup = (ev) => { if (!pop.contains(ev.target)) close(); };
    pop.append(btn, menu);
    wrap.append(l, pop); return wrap;
  }
  function controls() {
    const bar = $('ate-bar'); bar.textContent = '';
    const np = (v) => (STRATA[v] || {}).all ? STRATA[v].all.n_pools : '';
    bar.append(
      seg('experiment', 'exp', [['v1', `v1 · ${np('v1')} pools`], ['v2', `v2 · ${np('v2')} pools`],
        ['all', 'all · wt / het / mixed']]),
      seg('outcome', 'unit', [['events', 'events · bouts/min'],
        ['decay', 'timing · decay, min'], ['time', 'occupancy · the alternative']]),
      seg('behaviour', 'behav', [['nn', 'nose-to-nose'], ['nt', 'nose-to-tail']]),
      seg('line', 'line', LINES.map(l => [l, l])),
      seg('sex', 'sex', SEXES),
      ...(uniq('model').length > 1 ? [predictorPopup(uniq('model'))] : []),
      seg('table', 'table', [[false, 'chart'], [true, 'chart + table']]),
    );
  }

  function cellOf(g, odour, trans, method) {
    return cells.find(c => c.exp === g.exp && c.unit === state.unit && c.behav === state.behav
      && c.model === state.model && c.stratum === g.id && c.odour === odour
      && c.trans === trans && c.method === method) || null;
  }
  const plural = (k, w) => `${k} ${w}${k === 1 ? '' : 's'}`;
  /* A mark, or the reason there is none. Never null: an empty slot in this figure is a bug. */
  function slot(g, odour, trans, method) {
    const na = (why) => ({ na: true, method, trans, group: g, text: 'n/a — ' + why });
    if (method !== 'ppci' && g.exp === 'v2') return na('v2 has no annotated pools');
    const c = cellOf(g, odour, trans, method);
    if (!c) return na('not estimated for this predictor');
    if (method !== 'ppci' && g.k < 2) {
      return na(plural(g.k, 'annotated pool') + ' here: no clustered interval');
    }
    const ok = c.est != null && isFinite(c.est) && c.lo != null && isFinite(c.lo)
      && c.hi != null && isFinite(c.hi);
    if (!ok) {
      // on `decay` a pool needs an onset in BOTH phases' windows, so these counts can fall
      // below the stratum's pool count
      if (method === 'ppci') {
        return na(plural(c.n_unlab || 0, 'pool') + ' with a defined predicted value: no interval');
      }
      if ((c.n_lab || 0) < 2) {
        return na(plural(c.n_lab || 0, 'annotated pool') + ' with a defined value: no interval');
      }
      return na(plural(c.n_unlab || 0, 'unannotated pool') + ' with a defined value: '
        + 'PPI++ needs 2');
    }
    return Object.assign({ group: g }, c);
  }

  // ---------------------------------------------------------------- scale over everything drawn
  /* An interval built on 2 pools has ONE degree of freedom (t = 12.7), so it is uninformative by
     construction; it is drawn CLIPPED with an arrow cap instead of setting the shared domain.
     The test applies to both t-interval methods (CI and PPI++ take the same t_{n-1}); PPCI is
     exempt -- its interval is a percentile bootstrap over the pools it averages. */
  const SETS_SCALE = (c) => c.n_lab >= 3 || c.method === 'ppci';
  function domain(list) {
    let lo = 0, hi = 0;
    list.filter(c => !c.na).forEach(c => {
      const vs = SETS_SCALE(c) ? [c.lo, c.hi, c.est] : [c.est];
      vs.forEach(v => {
        if (v != null && isFinite(v)) { lo = Math.min(lo, v); hi = Math.max(hi, v); }
      });
    });
    if (lo === hi) { lo -= 1; hi += 1; }
    const pad = (hi - lo) * 0.14;
    return [lo - pad, hi + pad];
  }
  function ticks([lo, hi]) {
    const raw = (hi - lo) / 4;
    const mag = Math.pow(10, Math.floor(Math.log10(raw)));
    const step = [1, 2, 2.5, 5, 10].map(s => s * mag).find(s => s >= raw) || mag * 10;
    const out = [];
    for (let t = Math.ceil(lo / step) * step; t <= hi + 1e-9; t += step) out.push(+t.toFixed(10));
    return out;
  }

  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };

  function tip(node, html) {
    const tt = $('ate-tt');
    const show = (ev) => {
      tt.innerHTML = html; tt.style.opacity = '1';
      const r = tt.getBoundingClientRect();
      const x = (ev.clientX ?? 0) + 14, y = (ev.clientY ?? 0) + 14;
      tt.style.left = Math.min(x, innerWidth - r.width - 10) + 'px';
      tt.style.top = Math.min(y, innerHeight - r.height - 10) + 'px';
    };
    node.addEventListener('mouseenter', show);
    node.addEventListener('mousemove', show);
    node.addEventListener('focus', () => {
      const b = node.getBoundingClientRect();
      show({ clientX: b.left + b.width / 2, clientY: b.top });
    });
    const hide = () => { tt.style.opacity = '0'; };
    node.addEventListener('mouseleave', hide);
    node.addEventListener('blur', hide);
  }

  /* One panel = one exposure. Two stacked BLOCKS, each with its own axis: the behaviour scale
     (CI, PPI++) and the model scale (PPCI). Rows are transition x group; each row carries one
     line per method of its block -- a mark, or an explicit n/a. */
  function panel(title, blocks, doms) {
    const W = 480, L = 128, R = 58, rowH = 24, groupPad = 12, mono = 'ui-monospace,monospace';
    const blockH = (b) => 22 + b.rows.reduce((h, r) => h + r.slots.length * rowH + groupPad, 0)
      + 40;
    const H = 22 + blocks.reduce((h, b) => h + blockH(b), 0);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': `${title}. ${blocks.map(b => b.title).join('; ')}.` });
    const ttl = el('text', { x: 0, y: 12, fill: css('--ink-2'), 'font-size': 10.5,
      'font-weight': 600, 'font-family': mono });
    ttl.textContent = title; svg.appendChild(ttl);
    let top = 22;
    blocks.forEach(b => {
      const dom = doms[b.key];
      const x = (v) => L + (v - dom[0]) / (dom[1] - dom[0]) * (W - L - R);
      const bt = el('text', { x: 0, y: top + 10, fill: css('--ink-3'), 'font-size': 9,
        'letter-spacing': '.06em', 'font-family': mono });
      bt.textContent = b.title.toUpperCase(); svg.appendChild(bt);
      const bodyTop = top + 22;
      const bodyH = b.rows.reduce((h, r) => h + r.slots.length * rowH + groupPad, 0);
      ticks(dom).forEach(t => {
        svg.appendChild(el('line', { x1: x(t), x2: x(t), y1: bodyTop - 6, y2: bodyTop + bodyH,
          stroke: css('--ate-grid'), 'stroke-width': t === 0 ? 1.6 : 0.8 }));
        const tx = el('text', { x: x(t), y: bodyTop + bodyH + 14, 'text-anchor': 'middle',
          fill: css('--ink-3'), 'font-size': 9.5, 'font-family': mono });
        tx.textContent = (t > 0 ? '+' : '') + t; svg.appendChild(tx);
      });
      const ax = el('text', { x: (L + W - R) / 2, y: bodyTop + bodyH + 29, 'text-anchor': 'middle',
        fill: css('--ink-3'), 'font-size': 9.5, 'font-family': mono });
      ax.textContent = (b.key === 'mod' ? AXIS_MODEL : AXIS)[state.unit]; svg.appendChild(ax);

      let y = bodyTop + 10;
      b.rows.forEach(row => {
        const rl = el('text', { x: 0, y: y + 3, fill: css('--ink-3'), 'font-size': 9.5,
          'font-family': mono });
        rl.textContent = row.label; svg.appendChild(rl);
        if (row.sub) {
          const r2 = el('text', { x: 0, y: y + 15, fill: css('--ink-3'), 'font-size': 8.5,
            'font-family': mono, opacity: 0.8 });
          r2.textContent = row.sub; svg.appendChild(r2);
        }
        const ref = row.slots.find(c => c.method === 'ci' && !c.na);
        const refW = ref ? ref.hi - ref.lo : null;
        row.slots.forEach(c => {
          const col = css(M[c.method].v);
          const g = el('g', { class: 'ate-mark', tabindex: 0, role: 'button' });
          if (c.na) {
            g.setAttribute('data-na', '1');
            const t = el('text', { x: L + 4, y: y + 3.4, fill: col, 'font-size': 9.5,
              'font-style': 'italic', 'font-family': mono });
            t.textContent = `${M[c.method].name}  ${c.text}`; g.appendChild(t);
            tip(g, `<b>${M[c.method].long}</b> · ${row.label}<br>${c.text}`);
            svg.appendChild(g); y += rowH; return;
          }
          const clipLo = c.lo < dom[0], clipHi = c.hi > dom[1];
          const xa = clipLo ? x(dom[0]) : x(c.lo), xb = clipHi ? x(dom[1]) : x(c.hi);
          g.appendChild(el('line', { x1: xa, x2: xb, y1: y, y2: y, stroke: col, 'stroke-width': 2,
            'stroke-linecap': (clipLo || clipHi) ? 'butt' : 'round' }));
          if (clipLo) g.appendChild(el('path', { d: `M${xa - 5},${y}L${xa + 1},${y - 3.6}`
            + `L${xa + 1},${y + 3.6}Z`, fill: col }));
          if (clipHi) g.appendChild(el('path', { d: `M${xb + 5},${y}L${xb - 1},${y - 3.6}`
            + `L${xb - 1},${y + 3.6}Z`, fill: col }));
          const solid = c.method !== 'ppci';
          g.appendChild(el('circle', { cx: x(c.est), cy: y, r: 4.6,
            fill: solid ? col : css('--ate-surface'), stroke: solid ? css('--ate-surface') : col,
            'stroke-width': 2 }));
          const resolved = c.lo * c.hi > 0;
          const vl = el('text', { x: W - R + 8, y: y + 3.4, fill: css('--ink-2'),
            'font-size': 9.5, 'font-weight': resolved ? 600 : 400, 'font-family': mono });
          vl.textContent = fmt(c.est); g.appendChild(vl);
          let sh = '';
          if (refW && c.method === 'ppi') {
            const dd = 100 * (1 - (c.hi - c.lo) / refW);
            sh = `<br>CI width vs CI: <b>${dd >= 0 ? '−' : '+'}${Math.abs(dd).toFixed(0)}%</b>`;
          }
          tip(g, `<b>${M[c.method].long}</b> · ${title} · ${row.label}`
            + (row.sub ? ` (${row.sub})` : '') + '<br>'
            + `${fmt(c.est)} &nbsp;95% CI [${fmt(c.lo)}, ${fmt(c.hi)}]`
            + (c.method === 'ppci' ? ' &nbsp;<i>(model scale)</i>' : '') + '<br>'
            + `${c.n_lab} annotated${c.n_unlab ? ' / ' + c.n_unlab + ' predicted' : ''} pools`
            + (c.r != null ? `<br>within-cell r = ${c.r.toFixed(2)}` : '')
            + (c.lam != null ? `<br>λ = ${c.lam.toFixed(3)}` : '')
            + sh + `<br><span style="opacity:.7">${M[c.method].why}</span>`);
          svg.appendChild(g);
          y += rowH;
        });
        y += groupPad;
      });
      top += blockH(b);
    });
    return svg;
  }

  // ---------------------------------------------------------------- table view (relief + a11y)
  function table(rows) {
    const box = $('ate-tbl'); box.textContent = ''; box.hidden = !state.table;
    if (!state.table) return;
    const d = document.createElement('div'); d.className = 'scroll';
    const t = document.createElement('table');
    t.innerHTML = '<thead><tr><th>exposure</th><th>transition</th><th>group</th><th>estimator</th>'
      + '<th>estimate</th><th>95% CI</th><th>CI width</th><th>vs CI</th><th>pools</th>'
      + '<th>scale</th></tr></thead>';
    const tb = document.createElement('tbody');
    rows.forEach(({ odour, trans, group, slots }) => {
      const ref = slots.find(c => c.method === 'ci' && !c.na);
      const refW = ref ? ref.hi - ref.lo : null;
      slots.forEach(c => {
        const tr = document.createElement('tr');
        const head = `<td>${odour}</td><td>${trans}</td><td>${group}</td>`
          + `<td>${M[c.method].name}</td>`;
        if (c.na) {
          tr.innerHTML = head + `<td colspan="6">${c.text}</td>`;
        } else {
          const w = c.hi - c.lo;
          const rel = (refW && c.method === 'ppi')
            ? (100 * (1 - w / refW) >= 0 ? '−' : '+')
              + Math.abs(100 * (1 - w / refW)).toFixed(0) + '%' : '—';
          tr.innerHTML = head + `<td>${fmt(c.est)}</td><td>[${fmt(c.lo)}, ${fmt(c.hi)}]</td>`
            + `<td>${w.toFixed(2)}</td><td>${rel}</td>`
            + `<td>${c.n_lab}${c.n_unlab ? ' + ' + c.n_unlab : ''}</td>`
            + `<td>${c.method === 'ppci' ? 'model (sign only)' : 'behaviour'}</td>`;
        }
        tb.appendChild(tr);
      });
    });
    t.appendChild(tb); d.appendChild(t); box.appendChild(d);
  }

  function legend(gs) {
    const lg = $('ate-legend'); lg.textContent = '';
    const labelled = gs.some(g => g.exp === 'v1' && g.k >= 2);
    METHODS.forEach(m => {
      const s = document.createElement('span');
      const i = document.createElement('i'); i.style.background = css(m.v);
      const t = document.createElement('span'); t.textContent = m.long;
      if (m.key !== 'ppci' && !labelled) {
        s.style.opacity = '.4'; t.textContent = m.long + ' — n/a here';
      }
      s.append(i, t); lg.appendChild(s);
    });
    const pools = document.createElement('span'); pools.style.color = 'var(--ink-3)';
    pools.textContent = sliceName() + ': ' + gs.map(g => `${g.name} ${g.n ?? '?'} pools, `
      + `${g.k} annotated`).join(' · ');
    lg.appendChild(pools);
  }

  function render() {
    controls();
    const gs = groups();
    legend(gs);
    const panels = $('ate-panels'); panels.textContent = '';
    const many = gs.length > 1;
    // every slot of the view, built first so both axes share one domain across the two panels
    const view = ODOURS.map(([od, nice]) => ({
      od, nice,
      blocks: BLOCKS.map(b => ({
        key: b.key, title: b.title,
        rows: TRANS.flatMap(([tr, tn]) => gs.map(g => ({
          label: many ? `${tn.replace(/\s+/g, ' ')}` : tn,
          sub: many ? g.name : '',
          trans: tr, group: g,
          slots: b.methods.map(m => slot(g, od, tr, m)) }))),
      })),
    }));
    const doms = {};
    BLOCKS.forEach(b => {
      doms[b.key] = domain(view.flatMap(p => p.blocks.find(x => x.key === b.key).rows
        .flatMap(r => r.slots)));
    });
    const flat = [];
    view.forEach(p => {
      const d = document.createElement('div'); d.className = 'ate-panel';
      d.appendChild(panel(p.nice, p.blocks, doms));
      panels.appendChild(d);
      TRANS.forEach(([tr]) => gs.forEach(g => flat.push({
        odour: p.od, trans: tr, group: g.name,
        slots: p.blocks.flatMap(b => b.rows.filter(r => r.trans === tr && r.group === g)
          .flatMap(r => r.slots)) })));
    });

    const win = (META.window || {}).name || '';
    $('ate-note').innerHTML = 'Bars are 95% intervals, clustered on pool; bold values resolve. '
      + 'CI and PPI++ share the behaviour-scale axis; PPCI (hollow) has its own model-scale axis '
      + '&mdash; read its sign and pattern, not its distance from zero. An arrow cap means the '
      + 'interval runs past the axis (a 2-pool interval has one degree of freedom). '
      + (win ? `Window: ${win} against all of O and P.` : '');
    table(flat);
  }

  render();
  const mq = matchMedia('(prefers-color-scheme: dark)');
  mq.addEventListener && mq.addEventListener('change', render);
  new MutationObserver(render).observe(document.documentElement,
    { attributes: true, attributeFilter: ['data-theme'] });
})();
</script>
