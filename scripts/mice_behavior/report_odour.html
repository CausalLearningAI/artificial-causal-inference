<!-- Interactive exposure-split figure: ERM vs DERM bias on the held-out exposure, per
     behaviour x protocol leg, across training directions and arm variants. Injected by
     build_report.py, which replaces __ODOUR_JSON__ with derm.json's odour_split block
     (written by build_derm.py). Kept out of report_body.py: that file is one big f-string,
     and JS braces there would need doubling everywhere. -->
<style>
.osf{--os-erm:#eb6834;--os-derm:#2a78d6;
     --os-surface:var(--surface);--os-grid:var(--line)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]) .osf{
     --os-erm:#d95926;--os-derm:#3987e5}}
:root[data-theme="dark"] .osf{--os-erm:#d95926;--os-derm:#3987e5}
.osf{border:1px solid var(--line);border-radius:3px;background:var(--os-surface);
     margin:18px 0 0;overflow:hidden;
     /* the figure sits inside the 68ch text measure; centre it at full report width */
     width:min(1240px,calc(100vw - 56px));
     margin-left:calc((100% - min(1240px,100vw - 56px))/2)}
.osf-bar{display:flex;flex-wrap:wrap;gap:18px;align-items:flex-end;padding:14px 16px;
         border-bottom:1px solid var(--line);background:var(--surface-2)}
.osf-ctl{display:flex;flex-direction:column;gap:5px}
.osf-ctl .lab{font-family:var(--mono);font-size:.6rem;letter-spacing:.13em;
              text-transform:uppercase;color:var(--ink-3)}
.osf-seg{display:flex;border:1px solid var(--line);border-radius:3px;overflow:hidden;
         flex-wrap:wrap}
.osf-seg button{font-family:var(--mono);font-size:.72rem;padding:5px 11px;border:0;
                cursor:pointer;background:var(--surface);color:var(--ink-2);line-height:1.3}
.osf-seg button+button{border-left:1px solid var(--line)}
.osf-seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
.osf-seg button[disabled]{opacity:.4;cursor:not-allowed}
.osf-legend{display:flex;flex-wrap:wrap;gap:16px;padding:12px 16px 0;
            font-family:var(--mono);font-size:.72rem;color:var(--ink-2)}
.osf-legend span{display:inline-flex;align-items:center;gap:7px}
.osf-legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.osf-panel{padding:2px 16px 0;min-width:0}
.osf svg{width:100%;height:auto;display:block;overflow:visible}
.osf-note{font-family:var(--mono);font-size:.72rem;line-height:1.6;color:var(--ink-3);
          padding:12px 16px 16px}
.osf-tt{position:fixed;pointer-events:none;z-index:50;opacity:0;transition:opacity .1s;
        background:var(--ink);color:var(--bg);font-family:var(--mono);font-size:.7rem;
        line-height:1.55;padding:8px 10px;border-radius:3px;max-width:300px;
        white-space:normal}
.osf-tbl{padding:0 16px 16px}
.osf-tbl[hidden]{display:none}
.osf-tbl h5{font-family:var(--mono);font-size:.68rem;letter-spacing:.11em;
            text-transform:uppercase;color:var(--ink-3);font-weight:400;margin:14px 0 7px}
</style>

<div class="osf" id="osf">
  <div class="osf-bar" id="osf-bar"></div>
  <div class="osf-legend" id="osf-legend"></div>
  <div class="osf-panel" id="osf-panel"></div>
  <div class="osf-note" id="osf-note"></div>
  <div class="osf-tbl" id="osf-tbl" hidden></div>
</div>
<div class="osf-tt" id="osf-tt" role="status" aria-live="polite"></div>

<script>
(function () {
  const OS = __ODOUR_JSON__;
  const ARMS = OS.arms || {};

  // Variant registry mirrors build_derm.py's ODOUR_VARIANTS: (ERM tag suffix, DERM tag suffix).
  // The population-weight variants reuse the fixed-budget ERM leg -- ERM has no weights to fix.
  const KNOWN = [
    { id: '',         e: '',         d: '',              label: 'AP-selected' },
    { id: '_last',    e: '_last',    d: '_last',         label: 'fixed budget' },
    { id: '_popw',    e: '_last',    d: '_last_popw',    label: 'fixed budget + corrected weights' },
    { id: '_popw_s1', e: '_last_s1', d: '_last_popw_s1', label: 'corrected weights · seed 1' },
    { id: '_popw_s2', e: '_last_s2', d: '_last_popw_s2', label: 'corrected weights · seed 2' },
  ];
  const has = (dir, v) => !!(ARMS['tr' + dir + '_erm' + v.e] && ARMS['tr' + dir + '_derm' + v.d]);
  const VARIANTS = KNOWN.filter(v => has('F', v) || has('S', v));

  const ROWS = [
    { lab: 'nt', tr: 'H->O', name: 'nose-to-tail', leg: 'odour ON H→O' },
    { lab: 'nt', tr: 'O->P', name: 'nose-to-tail', leg: 'odour OFF O→P' },
    { lab: 'nn', tr: 'H->O', name: 'nose-to-nose', leg: 'odour ON H→O' },
    { lab: 'nn', tr: 'O->P', name: 'nose-to-nose', leg: 'odour OFF O→P' },
  ];
  const DIRS = { F: { label: 'train fear → test social', paired: 'train_fear' },
                 S: { label: 'train social → test fear', paired: 'train_social' } };

  const state = { dir: 'F',
                  variant: (VARIANTS.find(v => v.id === '_popw') || VARIANTS[VARIANTS.length - 1]
                            || { id: '' }).id,
                  table: false };

  const $ = (id) => document.getElementById(id);
  const css = (n) => getComputedStyle($('osf')).getPropertyValue(n).trim();
  const NS = 'http://www.w3.org/2000/svg';
  const el = (n, a) => { const e = document.createElementNS(NS, n);
    for (const k in a) e.setAttribute(k, a[k]); return e; };
  const txt = (s, a) => { const t = el('text', Object.assign(
    { 'font-family': 'ui-monospace,monospace' }, a)); t.textContent = s; return t; };
  const fmt = (v, d = 2) => (v >= 0 ? '+' : '−') + Math.abs(v).toFixed(d);

  const variant = () => VARIANTS.find(v => v.id === state.variant) || VARIANTS[0];
  const armE = () => ARMS['tr' + state.dir + '_erm' + variant().e];
  const armD = () => ARMS['tr' + state.dir + '_derm' + variant().d];
  const cell = (arm, r) => (((arm || {}).cells || {})[r.lab] || {})[r.tr];
  const pools = (arm, r) => (((arm || {}).per_pool || {})[r.lab] || {})[r.tr] || {};
  const paired = (r) => (((OS.paired || {})[DIRS[state.dir].paired + state.variant]
    || {})[r.lab] || {})[r.tr];

  // ------------------------------------------------------------------ controls & tooltip
  function seg(label, key, opts) {
    const wrap = document.createElement('div'); wrap.className = 'osf-ctl';
    const l = document.createElement('span'); l.className = 'lab'; l.textContent = label;
    const box = document.createElement('div'); box.className = 'osf-seg';
    box.setAttribute('role', 'group'); box.setAttribute('aria-label', label);
    opts.forEach(([val, t, off, why]) => {
      const b = document.createElement('button');
      b.type = 'button'; b.textContent = t;
      b.setAttribute('aria-pressed', String(state[key] === val));
      if (off) { b.disabled = true; b.title = why; }
      else b.onclick = () => { state[key] = val; render(); };
      box.appendChild(b);
    });
    wrap.append(l, box); return wrap;
  }

  function tip(node, html) {
    const tt = $('osf-tt');
    const show = (ev) => {
      tt.innerHTML = html; tt.style.opacity = '1';
      const r = tt.getBoundingClientRect();
      tt.style.left = Math.min((ev.clientX ?? 0) + 14, innerWidth - r.width - 10) + 'px';
      tt.style.top = Math.min((ev.clientY ?? 0) + 14, innerHeight - r.height - 10) + 'px';
    };
    node.addEventListener('mouseenter', show);
    node.addEventListener('mousemove', show);
    node.addEventListener('focus', () => { const b = node.getBoundingClientRect();
      show({ clientX: b.left + b.width / 2, clientY: b.top }); });
    const hide = () => { tt.style.opacity = '0'; };
    node.addEventListener('mouseleave', hide);
    node.addEventListener('blur', hide);
  }

  /* ONE x-scale across every variant and both directions, set by the widest 95% interval
     anywhere in the payload, so switching a control never rescales the axis under the reader.
     Per-pool dots spread far wider than the means; one past the edge is drawn AS a caret at
     the edge, the same convention the decay figure uses for clipped bands. */
  let DOM = 0.5;
  Object.values(ARMS).forEach(a => Object.values(a.cells || {}).forEach(byTr =>
    Object.values(byTr).forEach(c => {
      DOM = Math.max(DOM, Math.abs(c.lo), Math.abs(c.hi));
    })));
  DOM = Math.ceil(DOM * 21) / 20;         // 5% headroom, rounded up to 0.05

  // ------------------------------------------------------------------ the panel
  const W = 1180, L = 208, R = 148, TOP = 34, RH = 88, GAP = 14, AX = 46;
  const H = TOP + 4 * RH + GAP + AX;

  function panel() {
    const x = (v) => L + (v + DOM) / (2 * DOM) * (W - L - R);
    const svg = el('svg', { viewBox: `0 0 ${W} ${H}`, role: 'img',
      'aria-label': `Bias of the estimated phase-transition effect on the held-out exposure, `
        + `ERM against DERM, ${DIRS[state.dir].label}, four behaviour-by-leg cells with 95% `
        + `confidence intervals and one faint dot per pool.` });

    // x grid + axis
    const step = DOM > 0.9 ? 0.5 : 0.25;
    for (let t = -Math.floor(DOM / step) * step; t <= DOM + 1e-9; t += step) {
      const zero = Math.abs(t) < 1e-9;
      svg.appendChild(el('line', { x1: x(t), x2: x(t), y1: TOP - 6,
        y2: TOP + 4 * RH + GAP, stroke: zero ? css('--ink-3') : css('--os-grid'),
        'stroke-width': zero ? 1.6 : 0.8 }));
      svg.appendChild(txt(zero ? '0' : fmt(t, 2), { x: x(t), y: TOP + 4 * RH + GAP + 18,
        'text-anchor': 'middle', fill: zero ? css('--ink-2') : css('--ink-3'),
        'font-size': 11, 'font-weight': zero ? 600 : 400 }));
    }
    svg.appendChild(txt('bias of the estimated transition, bouts per minute '
      + '(0 = the human-annotation effect, reproduced)', {
      x: (L + W - R) / 2, y: TOP + 4 * RH + GAP + 40, 'text-anchor': 'middle',
      fill: css('--ink-3'), 'font-size': 11 }));

    ROWS.forEach((r, i) => {
      const y0 = TOP + i * RH + (i > 1 ? GAP : 0);
      // separate the two behaviours with a faint ground on the second
      if (r.lab === 'nn') svg.appendChild(el('rect', { x: 0, y: y0, width: W,
        height: RH, fill: css('--ink'), opacity: 0.022 }));
      const ce = cell(armE(), r), cd = cell(armD(), r), pr = paired(r);

      // row label: behaviour, leg, and the truth it is measured against
      svg.appendChild(txt(r.name, { x: 14, y: y0 + 30, fill: css('--ink-2'),
        'font-size': 13, 'font-weight': 600 }));
      svg.appendChild(txt(r.leg, { x: 14, y: y0 + 48, fill: css('--ink-3'),
        'font-size': 11 }));
      if (ce) svg.appendChild(txt(`true effect ${fmt(ce.true_dY)}`, { x: 14, y: y0 + 66,
        fill: css('--ink-3'), 'font-size': 11 }));

      [[ce, armE(), 'ERM', css('--os-erm'), y0 + 28],
       [cd, armD(), 'DERM', css('--os-derm'), y0 + 62]].forEach(([c, arm, name, col, y]) => {
        if (!c) {
          svg.appendChild(txt(`${name}: not landed`, { x: L + 8, y: y + 4,
            fill: css('--ink-3'), 'font-size': 11 }));
          return;
        }
        // one faint dot per pool; a pool past the axis is a caret at the edge, not dropped
        Object.entries(pools(arm, r)).forEach(([pool, v]) => {
          if (Math.abs(v) > DOM) {
            const xe = v > 0 ? x(DOM) : x(-DOM), s = v > 0 ? 1 : -1;
            const p = el('path', { d: `M${xe},${y - 4}L${xe},${y + 4}L${xe + s * 6},${y}Z`,
              fill: col, opacity: 0.5, tabindex: 0 });
            tip(p, `<b>pool ${pool}</b> · ${name}<br>bias ${fmt(v)} — past the axis`);
            svg.appendChild(p);
          } else {
            const p = el('circle', { cx: x(v), cy: y, r: 3, fill: col, opacity: 0.28 });
            tip(p, `<b>pool ${pool}</b> · ${name}<br>bias ${fmt(v)} bouts/min`);
            svg.appendChild(p);
          }
        });
        // 95% CI whisker + mean dot, one hover target
        const g = el('g', { tabindex: 0, role: 'img',
          'aria-label': `${name}: bias ${fmt(c.mean)}, 95% CI ${fmt(c.lo)} to ${fmt(c.hi)}` });
        g.appendChild(el('line', { x1: x(c.lo), x2: x(c.hi), y1: y, y2: y, stroke: col,
          'stroke-width': 2 }));
        [c.lo, c.hi].forEach(v => g.appendChild(el('line', { x1: x(v), x2: x(v),
          y1: y - 5, y2: y + 5, stroke: col, 'stroke-width': 2 })));
        g.appendChild(el('circle', { cx: x(c.mean), cy: y, r: 5.5, fill: col,
          stroke: css('--os-surface'), 'stroke-width': 2 }));
        g.appendChild(txt(fmt(c.mean), { x: x(c.mean), y: y - 12, 'text-anchor': 'middle',
          fill: css('--ink-2'), 'font-size': 11.5, 'font-weight': 600,
          stroke: css('--os-surface'), 'stroke-width': 3.5, 'paint-order': 'stroke' }));
        const resid = ((arm.match_resid || {})[r.lab]);
        tip(g, `<b>${name} · ${r.name} · ${r.leg}</b><br>`
          + `bias ${fmt(c.mean)} bouts/min · 95% CI [${fmt(c.lo)}, ${fmt(c.hi)}]<br>`
          + `estimates ${fmt(c.pred_dF)} where the truth is ${fmt(c.true_dY)}<br>`
          + `${c.n_pools} pools · rate matched to `
          + (resid == null ? 'n/a' : `${(100 * Math.abs(resid)).toFixed(1)}%`));
        svg.appendChild(g);
      });

      // the paired test, on the right where the row ends
      if (pr) {
        const strong = pr.p < 0.05;
        svg.appendChild(txt('ERM−DERM ' + fmt(pr.erm_minus_derm), {
          x: W - R + 12, y: y0 + 38, fill: css('--ink-2'), 'font-size': 11 }));
        svg.appendChild(txt('p ' + (pr.p < 1e-4 ? '< 0.0001' : '= ' + pr.p.toFixed(4)), {
          x: W - R + 12, y: y0 + 56, fill: strong ? css('--good') : css('--ink-3'),
          'font-size': 11, 'font-weight': strong ? 600 : 400 }));
      }
      if (i < 3) svg.appendChild(el('line', { x1: 0, x2: W,
        y1: y0 + RH + (i === 1 ? GAP / 2 : 0), y2: y0 + RH + (i === 1 ? GAP / 2 : 0),
        stroke: css('--os-grid'), 'stroke-width': i === 1 ? 1.2 : 0.6 }));
    });
    return svg;
  }

  // ------------------------------------------------------------------ table view
  function table() {
    const box = $('osf-tbl'); box.textContent = ''; box.hidden = !state.table;
    if (!state.table) return;
    const h = document.createElement('h5');
    h.textContent = `${DIRS[state.dir].label} · ${variant().label}`;
    const w = document.createElement('div'); w.className = 'scroll';
    w.innerHTML = '<table><thead><tr><th>cell</th><th>true effect</th>'
      + '<th>ERM bias</th><th>ERM 95% CI</th><th>DERM bias</th><th>DERM 95% CI</th>'
      + '<th>paired ERM−DERM</th><th>p</th></tr></thead><tbody>'
      + ROWS.map(r => {
        const ce = cell(armE(), r), cd = cell(armD(), r), pr = paired(r);
        const f = (c, k) => c ? fmt(c[k], 3) : '—';
        const ci = (c) => c ? `[${fmt(c.lo)}, ${fmt(c.hi)}]` : '—';
        return `<tr><td>${r.name} · ${r.leg}</td><td>${f(ce, 'true_dY')}</td>`
          + `<td>${f(ce, 'mean')}</td><td>${ci(ce)}</td>`
          + `<td>${f(cd, 'mean')}</td><td>${ci(cd)}</td>`
          + `<td>${pr ? fmt(pr.erm_minus_derm, 3) : '—'}</td>`
          + `<td>${pr ? pr.p.toFixed(4) : '—'}</td></tr>`;
      }).join('') + '</tbody></table>';
    box.append(h, w);
  }

  // ------------------------------------------------------------------ render
  function render() {
    // self-heal: if the state names a direction x variant pair that was never trained (the seed
    // replicates cover the fear direction only), keep the direction and snap the variant to one
    // that exists there, rather than trusting the disabled buttons to have made this unreachable.
    if (!has(state.dir, variant())) {
      const v = VARIANTS.find(v2 => has(state.dir, v2));
      if (v) state.variant = v.id;
    }
    const bar = $('osf-bar'); bar.textContent = '';
    bar.append(
      seg('trained on', 'dir', Object.entries(DIRS).map(([k, d]) =>
        [k, d.label, !has(k, variant()),
         'this variant has not been trained in this direction'])),
      seg('arms', 'variant', VARIANTS.map(v =>
        [v.id, v.label, !has(state.dir, v),
         'not trained in this direction — the seed replicates cover the fear '
         + 'direction, where the confound lives'])),
      seg('view', 'table', [[false, 'chart'], [true, 'chart + table']]));

    const e = armE(), d = armD();
    $('osf-legend').innerHTML =
      '<span><i style="background:var(--os-erm)"></i>ERM</span>'
      + '<span><i style="background:var(--os-derm)"></i>DERM</span>'
      + '<span style="color:var(--ink-3)">dot + whisker = mean bias over '
      + ((e && e.n_pools) || 24) + ' pools with 95% CI · faint dot = one pool · '
      + 'bias = estimated minus true transition, bouts/min</span>';

    const p = $('osf-panel'); p.textContent = '';
    if (e && d) p.appendChild(panel());
    else p.innerHTML = '<p style="font-family:var(--mono);font-size:.75rem;'
      + 'color:var(--ink-3);padding:14px 0">This arm pair has not landed yet.</p>';

    // the sign test for this variant, computed from the payload, never retyped
    const st = (OS.sign_test || {});
    const key = (o, s) => st[o + s] || null;
    const count = (o, s) => { const b = key(o, s); if (!b) return null;
      let n = 0, k = 0;
      ROWS.forEach(r => { const c = (b[r.lab] || {})[r.tr];
        if (c) { k++; if (c.reverses) n++; } });
      return k ? `${n}/${k}` : null; };
    const se = count('erm', variant().e), sd = count('derm', variant().d);
    $('osf-note').innerHTML =
      (se ? `Sign test for these arms — does the bias reverse when the training direction `
        + `flips, as an imported phase prior must and a plain generalisation gap cannot: `
        + `ERM reverses in <b>${se}</b> cells` + (sd ? `, DERM in ${sd} (its near-zero `
        + `fear-trained biases make the sign moot where the correction has worked)` : '')
        + '. ' : '')
      + 'Held-out exposure, 15-minute matched window, thresholds rate-matched in rank '
      + 'space per arm. A faint dot past the axis edge is drawn as a caret, never dropped. '
      + 'This split is a LOWER BOUND on deployment bias — the model has seen the test '
      + 'pools’ cages in its own training session — and it cannot feed PPI++.';
    table();
  }
  render();
})();
</script>
