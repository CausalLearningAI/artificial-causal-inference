# @package _global_
# Tracking config for ants/v4_infested (Exp4, INFESTED colony)

subject: ants
version: v4_infested


quantile: 0.85
n_background_frames: 40
pov_radius: 80

max_dist_activity: 80
max_step: 100
min_area_color: 5
max_area_color: 400
min_area_body: 100
max_area_body: 2000

# HSV bounds copied from v4: same lab, same rig (FLIR BFS-U3-120S4C + Edmund 25mm HP lens,
# per the lab xlsx for both the HEALTHY and INFESTED sheets), same EDDING 750 markers and
# the same colour-marking people (A, B). Validated on a sample before the full run.
yellow_marking_lb: [0, 60, 60]
yellow_marking_ub: [8, 255, 255]
blue_marking_lb: [80, 50, 70]
blue_marking_ub: [135, 255, 255]
